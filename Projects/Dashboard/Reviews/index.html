<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Reviews · My Dashboard 0.9.0</title>
  <script src="../dashboard-config.js?v=0.9.0"></script>
  <script src="../dashboard-auth.js?v=0.9.0" data-dashboard-project="reviews"></script>
  <script src="../dashboard-streaming.js?v=0.9.0"></script>
  <style>
    :root{--bg:#f7f8fa;--panel:#fff;--text:#252525;--muted:#68707d;--line:#d8dde5;--blue:#2450a4;--blue2:#3478e5;--soft:#eef4ff;--danger:#b3261e;--shadow:0 12px 32px rgba(20,30,50,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1400px,calc(100% - 28px));margin:auto;padding:22px 0 60px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(2rem,6vw,3.25rem);letter-spacing:-.045em}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 15px;border-radius:14px;font-weight:700;min-height:44px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger)}.section{margin-top:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.section h2{margin:0;font-size:1.25rem}.section-note{margin:4px 0 0;color:var(--muted);font-size:.9rem}.empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#fff}.rail,.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}.card{position:relative;min-width:0;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}.poster-wrap{aspect-ratio:2/3;background:#e9edf3;position:relative}.poster{width:100%;height:100%;object-fit:cover;display:block}.poster-fallback{height:100%;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);font-weight:800}.score{position:absolute;right:8px;top:8px;background:rgba(18,24,34,.86);color:#fff;border-radius:999px;padding:5px 8px;font-weight:800;font-size:.78rem}.card-body{padding:11px}.card-title{margin:0;font-size:.94rem;line-height:1.25}.card-meta{margin:5px 0 0;color:var(--muted);font-size:.78rem;line-height:1.35}.card-actions{display:flex;gap:7px;margin-top:9px}.mini{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;font-size:.75rem;font-weight:700}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}.modal{position:fixed;inset:0;z-index:50;background:rgba(14,20,30,.58);display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px)}.modal[hidden]{display:none}.sheet{width:min(960px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--bg);border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.3)}.sheet-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px;background:rgba(247,248,250,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.sheet-head h2{margin:0;text-align:center;font-size:1.15rem}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:22px}.sheet-body{padding:18px}.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.type-btn{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800}.type-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.search-row{display:flex;gap:8px;margin-top:12px}.search-row input{flex:1;min-width:0}.control,input,select,textarea{width:100%;border:1px solid #c8ced8;border-radius:12px;background:#fff;color:var(--text);padding:11px 12px;font-size:16px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}.result{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;text-align:left;padding:0}.result img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#e9edf3}.result .rtext{padding:9px}.result strong{display:block;font-size:.85rem}.result span{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.selected{display:grid;grid-template-columns:110px 1fr;gap:15px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:14px 0}.selected img{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#e9edf3}.selected h3{margin:0}.selected p{color:var(--muted);margin:5px 0;font-size:.88rem}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.82rem;font-weight:800}.field small{color:var(--muted)}textarea{min-height:92px;resize:vertical}.rating{display:flex;gap:6px;flex-wrap:wrap}.rating button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:800}.rating button.active{background:var(--blue);border-color:var(--blue);color:#fff}.save-row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detail-hero{display:grid;grid-template-columns:160px 1fr;gap:18px}.detail-hero img{width:160px;aspect-ratio:2/3;object-fit:cover;border-radius:14px}.detail-hero h3{font-size:1.6rem;margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:#eaf0fb;border-radius:999px;padding:5px 8px;font-size:.75rem}.season-list{display:grid;gap:10px;margin-top:18px}.season-review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.season-review h4{margin:0}.review-copy{white-space:pre-wrap;line-height:1.5}.status{min-height:22px;margin-top:10px;color:var(--muted);font-size:.85rem}.status.error{color:var(--danger)}
    @media(max-width:650px){.app{width:min(100% - 20px,1400px);padding-top:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.selected{grid-template-columns:82px 1fr}.selected img{width:82px}.detail-hero{grid-template-columns:95px 1fr}.detail-hero img{width:95px}.rail,.library{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.type-row{grid-template-columns:1fr}.sheet-body{padding:13px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div><h1>Reviews</h1><p>Automatic covers and metadata. Your opinion is the only part you type.</p></div><div class="actions"><a class="btn" href="../">Dashboard</a><button id="add-review" class="btn primary" type="button">+ Add Review</button></div></header>

    <section class="section"><div class="section-head"><div><h2>From Streaming</h2><p class="section-note">Finished movies and fully completed TV seasons appear here automatically.</p></div><button id="refresh-queue" class="btn" type="button">Refresh</button></div><div id="queue" class="rail"></div></section>

    <section class="section"><div class="section-head"><div><h2>Your Reviews</h2><p class="section-note">TV season reviews are grouped under the same show.</p></div></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="movie">Movies</button><button class="filter" data-filter="tv">TV</button><button class="filter" data-filter="book">Books</button></div><div id="library" class="library"></div></section>
    <p id="page-status" class="status" role="status"></p>
  </main>

  <div id="review-modal" class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="review-title"><header class="sheet-head"><span></span><h2 id="review-title">Add Review</h2><button class="close" data-close="review-modal" aria-label="Close">×</button></header><div class="sheet-body">
    <div class="type-row"><button class="type-btn active" data-type="movie">🎬 Movie</button><button class="type-btn" data-type="tv">📺 TV Season</button><button class="type-btn" data-type="book">📚 Book</button></div>
    <div id="search-block"><div class="search-row"><input id="search-input" placeholder="Search for a title"><button id="search-button" class="btn primary" type="button">Search</button></div><div id="search-results" class="results"></div><p id="search-status" class="status"></p></div>
    <div id="selected-block" hidden><div id="selected-item" class="selected"></div><div id="season-field" class="field" hidden><label for="season-select">Season</label><select id="season-select"></select></div></div>
    <form id="review-form" hidden>
      <div class="form-grid">
        <div class="field"><label>Were you able to stay focused?</label><select id="focused"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option><option value="other">Other / mixed</option></select></div>
        <div class="field"><label>Would you watch/read again?</label><select id="revisit"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option><option value="maybe">Maybe</option></select></div>
        <div class="field"><label>Was it a good plot?</label><select id="plot"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></div>
        <div class="field"><label>How was the pace?</label><select id="pace"><option value="">Choose…</option><option value="1">1 · Very slow</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 · Very fast</option></select></div>
        <div class="field full"><label>How was the ending?</label><textarea id="ending"></textarea></div>
        <div class="field full"><label>Did it meet expectations?</label><textarea id="expectations"></textarea></div>
        <div class="field full"><label>Favorite characters</label><input id="characters"></div>
        <div class="field full"><label>Short summary</label><textarea id="summary"></textarea></div>
        <div class="field full"><label>Overall rating</label><div id="rating" class="rating"></div></div>
        <div class="field"><label>Would you recommend it?</label><select id="recommend"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></div>
        <div class="field"><label>Did you include spoilers?</label><select id="spoilers"><option value="no">No</option><option value="yes">Yes</option></select></div>
        <div class="field full"><label>Tags <small>(optional, comma-separated)</small></label><input id="tags" placeholder="comfort, funny, favorite"></div>
      </div>
      <div class="save-row"><button class="btn" type="button" id="change-title">Change title</button><button class="btn primary" type="submit">Save Review</button></div><p id="form-status" class="status"></p>
    </form>
  </div></section></div>

  <div id="detail-modal" class="modal" hidden><section class="sheet" role="dialog" aria-modal="true"><header class="sheet-head"><span></span><h2>Review</h2><button class="close" data-close="detail-modal" aria-label="Close">×</button></header><div id="detail-body" class="sheet-body"></div></section></div>

  <script>
  (()=>{
    "use strict";
    const $=id=>document.getElementById(id); const today=()=>new Date().toISOString().slice(0,10);
    let client,user,reviews=[],queue=[],activeType="movie",selected=null,rating=0,filter="all",editingId=null;
    const poster=p=>p?`https://image.tmdb.org/t/p/w500${p}`:"";
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    function status(msg,error=false){$("page-status").textContent=msg||"";$("page-status").classList.toggle("error",error)}
    function show(id){$(id).hidden=false} function hide(id){$(id).hidden=true}
    function mediaLabel(t){return t==="tv"?"TV":t==="book"?"Book":"Movie"}
    async function ready(){
      if(window.DashboardAuth?.ready) await window.DashboardAuth.ready;
      client=window.DashboardAuth?.client; user=window.DashboardAuth?.user;
      if(!client||!user?.id) throw new Error("Reviews requires a signed-in Dashboard session.");
      buildRating(); bind(); await refreshAll();
    }
    function buildRating(){const box=$("rating");box.innerHTML="";for(let i=1;i<=10;i++){const b=document.createElement("button");b.type="button";b.textContent=i;b.onclick=()=>{rating=i;[...box.children].forEach((x,j)=>x.classList.toggle("active",j<i))};box.appendChild(b)}}
    function bind(){
      $("add-review").onclick=()=>openReview(); $("refresh-queue").onclick=()=>loadQueue(true);
      $("search-button").onclick=search; $("search-input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search()}});
      document.querySelectorAll(".type-btn").forEach(b=>b.onclick=()=>setType(b.dataset.type));
      document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderLibrary()});
      document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>hide(b.dataset.close));
      document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.hidden=true}));
      $("change-title").onclick=()=>resetSelection(); $("review-form").onsubmit=saveReview; $("season-select").onchange=loadSelectedSeason;
    }
    function setType(type){activeType=type;document.querySelectorAll(".type-btn").forEach(b=>b.classList.toggle("active",b.dataset.type===type));resetSelection();$("search-input").placeholder=type==="book"?"Search books":"Search movies or shows"}
    function resetSelection(){selected=null;editingId=null;hide("selected-block");hide("review-form");show("search-block");$("search-results").innerHTML="";$("search-status").textContent="";rating=0;buildRating()}
    function openReview(seed=null){show("review-modal");resetForm();setType(seed?.media_type||"movie");if(seed)selectSeed(seed)}
    function resetForm(){["focused","revisit","plot","pace","ending","expectations","characters","summary","recommend","tags"].forEach(id=>$(id).value="");$("spoilers").value="no";$("form-status").textContent="";rating=0;buildRating()}
    async function search(){const q=$("search-input").value.trim();if(!q)return;$("search-status").textContent="Searching…";$("search-results").innerHTML="";try{const items=activeType==="book"?await searchBooks(q):await searchTmdb(q,activeType);renderResults(items);$("search-status").textContent=items.length?"":"No results found."}catch(e){$("search-status").textContent=e.message}}
    async function searchTmdb(q,type){const data=await window.DashboardStreaming.tmdb(`/search/${type}`,{query:q,include_adult:false,page:1});return(data.results||[]).slice(0,15).map(x=>({media_type:type,source:"tmdb",source_id:String(x.id),tmdb_id:x.id,title:x.title||x.name,creator:"",poster_path:x.poster_path,cover_url:poster(x.poster_path),release_date:x.release_date||x.first_air_date||null,genres:[],raw:x}))}
    async function searchBooks(q){const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=15&fields=key,title,author_name,first_publish_year,cover_i,subject`);if(!r.ok)throw new Error("Book search is unavailable right now.");const d=await r.json();return(d.docs||[]).map(x=>({media_type:"book",source:"openlibrary",source_id:x.key,title:x.title,creator:(x.author_name||[]).join(", "),cover_url:x.cover_i?`https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`:"",release_date:x.first_publish_year?`${x.first_publish_year}-01-01`:null,genres:(x.subject||[]).slice(0,8),raw:x}))}
    function renderResults(items){const box=$("search-results");box.innerHTML="";items.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=`${item.cover_url?`<img src="${esc(item.cover_url)}" alt="">`:`<div class="poster-wrap"><div class="poster-fallback">${esc(item.title)}</div></div>`}<div class="rtext"><strong>${esc(item.title)}</strong><span>${esc(item.creator||item.release_date?.slice(0,4)||"")}</span></div>`;b.onclick=()=>selectItem(item);box.appendChild(b)})}
    async function selectItem(item){selected={...item};hide("search-block");show("selected-block");if(item.media_type==="tv"){const detail=await window.DashboardStreaming.getTitleDetails(item.tmdb_id,"tv");selected.raw=detail;selected.title=detail.name||selected.title;selected.poster_path=detail.poster_path;selected.cover_url=poster(detail.poster_path);selected.genres=(detail.genres||[]).map(g=>g.name);const seasons=(detail.seasons||[]).filter(s=>s.season_number>0&&(!s.air_date||s.air_date<=today()));const sel=$("season-select");sel.innerHTML=seasons.map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join("");show("season-field");if(seasons.length)await loadSelectedSeason()}else{hide("season-field");if(item.media_type==="movie"){const detail=await window.DashboardStreaming.getTitleDetails(item.tmdb_id,"movie");selected.raw=detail;selected.title=detail.title||selected.title;selected.poster_path=detail.poster_path;selected.cover_url=poster(detail.poster_path);selected.genres=(detail.genres||[]).map(g=>g.name);selected.release_date=detail.release_date||selected.release_date}renderSelected();show("review-form")}}
    async function loadSelectedSeason(){if(!selected?.tmdb_id)return;const n=Number($("season-select").value);const s=await window.DashboardStreaming.getTvSeasonDetails(selected.tmdb_id,n);selected.season_number=n;selected.season=s;selected.cover_url=poster(s.poster_path||selected.poster_path);selected.release_date=s.air_date||selected.raw?.first_air_date||null;renderSelected();show("review-form")}
    function renderSelected(){$("selected-item").innerHTML=`${selected.cover_url?`<img src="${esc(selected.cover_url)}" alt="">`:""}<div><h3>${esc(selected.title)}</h3><p>${esc(mediaLabel(selected.media_type))}${selected.season_number?` · Season ${selected.season_number}`:""}</p><p>${esc(selected.creator||"")}</p><p>${esc((selected.genres||[]).slice(0,5).join(" · "))}</p></div>`}
    async function selectSeed(seed){if(seed.media_type==="movie"){const d=await window.DashboardStreaming.getTitleDetails(seed.tmdb_id,"movie");await selectItem({media_type:"movie",source:"tmdb",source_id:String(seed.tmdb_id),tmdb_id:seed.tmdb_id,title:d.title,poster_path:d.poster_path,cover_url:poster(d.poster_path),release_date:d.release_date,genres:(d.genres||[]).map(g=>g.name),raw:d})}else{const d=await window.DashboardStreaming.getTitleDetails(seed.tmdb_id,"tv");selected={media_type:"tv",source:"tmdb",source_id:String(seed.tmdb_id),tmdb_id:seed.tmdb_id,title:d.name,poster_path:d.poster_path,cover_url:poster(d.poster_path),release_date:d.first_air_date,genres:(d.genres||[]).map(g=>g.name),raw:d};hide("search-block");show("selected-block");const seasons=(d.seasons||[]).filter(s=>s.season_number>0);$("season-select").innerHTML=seasons.map(s=>`<option value="${s.season_number}" ${s.season_number===seed.season_number?"selected":""}>Season ${s.season_number}</option>`).join("");show("season-field");await loadSelectedSeason()}}
    async function saveReview(e){e.preventDefault();if(!selected||!rating){$("form-status").textContent="Choose a title and rating first.";return}$("form-status").textContent="Saving…";const payload={user_id:user.id,media_type:selected.media_type,source:selected.source,source_id:selected.source_id,tmdb_id:selected.tmdb_id||null,season_number:selected.media_type==="tv"?Number(selected.season_number):null,title:selected.title,creator:selected.creator||null,cover_url:selected.cover_url||null,poster_path:selected.poster_path||null,release_date:selected.release_date||null,genres:selected.genres||[],series_name:selected.media_type==="tv"?selected.title:(selected.raw?.series_name||null),source_metadata:{source:selected.source},focused:$("focused").value==="yes"?true:$("focused").value==="no"?false:null,would_revisit:$("revisit").value||null,good_plot:$("plot").value==="yes"?true:$("plot").value==="no"?false:null,pace:$("pace").value?Number($("pace").value):null,ending:$("ending").value.trim()||null,met_expectations:$("expectations").value.trim()||null,favorite_characters:$("characters").value.trim()||null,short_summary:$("summary").value.trim()||null,overall_rating:rating,recommend:$("recommend").value==="yes"?true:$("recommend").value==="no"?false:null,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),spoilers:$("spoilers").value==="yes",updated_at:new Date().toISOString()};try{let q=client.from("reviews").select("id").eq("user_id",user.id).eq("source",payload.source).eq("source_id",payload.source_id).eq("media_type",payload.media_type);q=payload.season_number==null?q.is("season_number",null):q.eq("season_number",payload.season_number);const{data:existing,error:xerr}=await q.maybeSingle();if(xerr)throw xerr;const res=existing?await client.from("reviews").update(payload).eq("id",existing.id):await client.from("reviews").insert(payload);if(res.error)throw res.error;hide("review-modal");await refreshAll();status("Review saved.")}catch(err){$("form-status").textContent=err.message}}
    async function loadReviews(){const{data,error}=await client.from("reviews").select("*").eq("user_id",user.id).order("updated_at",{ascending:false});if(error)throw error;reviews=data||[];renderLibrary()}
    function groupLibrary(){const out=[];const tv=new Map();reviews.forEach(r=>{if(r.media_type!=="tv")out.push({kind:r.media_type,key:r.id,cover:r.cover_url,title:r.title,rating:r.overall_rating,items:[r]});else{const key=String(r.tmdb_id||r.source_id);if(!tv.has(key))tv.set(key,{kind:"tv",key,cover:r.poster_path?poster(r.poster_path):r.cover_url,title:r.title,rating:r.overall_rating,items:[]});tv.get(key).items.push(r);tv.get(key).rating=Math.max(...tv.get(key).items.map(x=>Number(x.overall_rating)||0))}});return[...out,...tv.values()]}
    function renderLibrary(){const box=$("library");box.innerHTML="";const groups=groupLibrary().filter(g=>filter==="all"||g.kind===filter);if(!groups.length){box.innerHTML='<div class="empty">No reviews here yet.</div>';return}groups.forEach(g=>{const c=document.createElement("article");c.className="card";const meta=g.kind==="tv"?`${g.items.length} season review${g.items.length===1?"":"s"}`:mediaLabel(g.kind);c.innerHTML=`<div class="poster-wrap">${g.cover?`<img class="poster" src="${esc(g.cover)}" alt="">`:`<div class="poster-fallback">${esc(g.title)}</div>`}<span class="score">★ ${esc(g.rating)}</span></div><div class="card-body"><h3 class="card-title">${esc(g.title)}</h3><p class="card-meta">${esc(meta)}</p><div class="card-actions"><button class="mini">Open</button></div></div>`;c.querySelector("button").onclick=()=>openDetail(g);box.appendChild(c)})}
    function openDetail(g){const body=$("detail-body");const first=g.items[0];let html=`<div class="detail-hero">${g.cover?`<img src="${esc(g.cover)}" alt="">`:""}<div><h3>${esc(g.title)}</h3><p>${esc(mediaLabel(g.kind))}</p><div class="chips">${(first.genres||[]).slice(0,8).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div></div><div class="season-list">`;g.items.sort((a,b)=>(a.season_number||0)-(b.season_number||0)).forEach(r=>{html+=`<article class="season-review"><h4>${r.media_type==="tv"?`Season ${r.season_number}`:esc(r.title)} · ★ ${esc(r.overall_rating)}/10</h4>${r.short_summary?`<p class="review-copy">${r.spoilers?"⚠️ Spoilers · ":""}${esc(r.short_summary)}</p>`:""}<p class="card-meta">Pace: ${esc(r.pace||"—")} · Recommend: ${r.recommend==null?"—":r.recommend?"Yes":"No"}</p></article>`});html+="</div>";body.innerHTML=html;show("detail-modal")}
    async function dismiss(item){const{error}=await client.from("review_queue_dismissals").upsert({user_id:user.id,media_type:item.media_type,tmdb_id:item.tmdb_id,season_number:item.season_number||0,dismissed_at:new Date().toISOString()},{onConflict:"user_id,media_type,tmdb_id,season_number"});if(error)throw error;await loadQueue()}
    async function loadQueue(force=false){$("queue").innerHTML='<div class="empty">Checking Streaming history…</div>';try{const[{data:states,error:sErr},{data:eps,error:eErr},{data:dismissed,error:dErr}]=await Promise.all([client.from("user_title_state").select("tmdb_id,media_type,viewing_status,watched_at,last_completed_season_number").eq("user_id",user.id),client.from("episode_progress").select("tmdb_show_id,season_number,episode_number,viewing_status,watched_at").eq("user_id",user.id).eq("viewing_status","watched"),client.from("review_queue_dismissals").select("media_type,tmdb_id,season_number").eq("user_id",user.id)]);if(sErr)throw sErr;if(eErr)throw eErr;if(dErr)throw dErr;const reviewed=new Set(reviews.filter(r=>r.tmdb_id).map(r=>`${r.media_type}:${r.tmdb_id}:${r.season_number||0}`));const dismissedSet=new Set((dismissed||[]).map(r=>`${r.media_type}:${r.tmdb_id}:${r.season_number||0}`));const found=[];for(const s of(states||[]).filter(x=>x.media_type==="movie"&&x.viewing_status==="watched")){const key=`movie:${s.tmdb_id}:0`;if(reviewed.has(key)||dismissedSet.has(key))continue;try{const d=await window.DashboardStreaming.getTitleDetails(s.tmdb_id,"movie");found.push({media_type:"movie",tmdb_id:s.tmdb_id,season_number:0,title:d.title,cover_url:poster(d.poster_path),date:s.watched_at})}catch{}}
      const groups=new Map();(eps||[]).forEach(e=>{if(e.season_number<=0)return;const k=`${e.tmdb_show_id}:${e.season_number}`;if(!groups.has(k))groups.set(k,{show:e.tmdb_show_id,season:e.season_number,watched:new Set()});groups.get(k).watched.add(Number(e.episode_number))});for(const g of groups.values()){const key=`tv:${g.show}:${g.season}`;if(reviewed.has(key)||dismissedSet.has(key))continue;try{const sd=await window.DashboardStreaming.getTvSeasonDetails(g.show,g.season);const episodes=(sd.episodes||[]);if(!episodes.length)continue;const allAired=episodes.every(ep=>ep.air_date&&ep.air_date<=today());const complete=allAired&&episodes.every(ep=>g.watched.has(Number(ep.episode_number)));if(!complete)continue;const show=await window.DashboardStreaming.getTitleDetails(g.show,"tv");found.push({media_type:"tv",tmdb_id:g.show,season_number:g.season,title:show.name,cover_url:poster(sd.poster_path||show.poster_path),date:episodes.at(-1)?.air_date})}catch{}}
      queue=found.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));renderQueue()}catch(e){$("queue").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
    function renderQueue(){const box=$("queue");box.innerHTML="";if(!queue.length){box.innerHTML='<div class="empty">Nothing waiting for a review.</div>';return}queue.forEach(item=>{const c=document.createElement("article");c.className="card";c.innerHTML=`<div class="poster-wrap">${item.cover_url?`<img class="poster" src="${esc(item.cover_url)}" alt="">`:""}</div><div class="card-body"><h3 class="card-title">${esc(item.title)}</h3><p class="card-meta">${item.media_type==="tv"?`Season ${item.season_number}`:"Finished movie"}</p><div class="card-actions"><button class="mini review">Review</button><button class="mini dismiss">Dismiss</button></div></div>`;c.querySelector(".review").onclick=()=>openReview(item);c.querySelector(".dismiss").onclick=()=>dismiss(item);box.appendChild(c)})}
    async function refreshAll(){status("Loading reviews…");await loadReviews();await loadQueue();status("")}
    window.addEventListener("dashboard-auth-ready",()=>ready().catch(e=>status(e.message,true)),{once:true});setTimeout(()=>{if(!user)ready().catch(e=>status(e.message,true))},800);
  })();
  </script>
