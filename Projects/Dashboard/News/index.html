<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>News · Version 0.1.0</title>
  <meta name="description" content="My Dashboard News · Version 0.1.0">
  <meta name="theme-color" content="#0b0d12">
  <script src="../dashboard-config.js?v=0.9.0"></script>
  <script src="../dashboard-auth.js?v=0.9.0" data-dashboard-project="news"></script>
  <style>
    :root{--bg:#080a0f;--panel:#10131a;--panel2:#151923;--text:#f7f8fb;--muted:#aeb5c2;--blue:#6da1ff;--line:rgba(255,255,255,.12);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
    .topbar{position:relative;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(9px + var(--safe-top)) 10px 9px;background:rgba(8,10,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .back,.icon-btn{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-width:42px;height:42px;font-weight:800}.brand{text-align:center;min-width:0}.brand strong{display:block;font-size:17px}.brand span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;gap:6px}.tabs{position:absolute;left:50%;bottom:-45px;transform:translateX(-50%);z-index:25;display:flex;gap:5px;padding:5px;background:rgba(11,14,20,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;max-width:calc(100vw - 22px);overflow:auto}.tab{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:8px 12px;border-radius:999px;white-space:nowrap}.tab.active{background:#fff;color:#0a0c10}
    .feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.story{position:relative;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-end;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(65,104,180,.34),transparent 38%),radial-gradient(circle at 80% 30%,rgba(135,61,155,.28),transparent 35%),linear-gradient(160deg,#171c27,#080a0f 72%)}
    .story::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02) 8%,rgba(0,0,0,.16) 45%,rgba(0,0,0,.88) 82%,#080a0f 100%);pointer-events:none}.story:nth-child(3n+2){background:radial-gradient(circle at 75% 18%,rgba(193,111,44,.3),transparent 36%),radial-gradient(circle at 20% 60%,rgba(42,112,126,.33),transparent 38%),linear-gradient(160deg,#1c2027,#080a0f 72%)}.story:nth-child(3n){background:radial-gradient(circle at 25% 22%,rgba(55,133,90,.33),transparent 38%),radial-gradient(circle at 85% 45%,rgba(68,75,180,.28),transparent 35%),linear-gradient(160deg,#171a24,#080a0f 72%)}
    .source-mark{position:absolute;inset:90px 0 auto 0;text-align:center;font-size:clamp(58px,18vw,150px);font-weight:950;letter-spacing:-.06em;color:rgba(255,255,255,.07);user-select:none}.story-content{position:relative;z-index:2;width:min(760px,100%);padding:82px 72px calc(30px + var(--safe-bottom)) 18px}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#d2d7df;margin-bottom:10px}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);font-weight:800}.headline{font-size:clamp(26px,6vw,44px);line-height:1.03;letter-spacing:-.035em;margin:0 0 12px;font-weight:900}.summary{font-size:clamp(15px,2.8vw,18px);line-height:1.45;color:#e2e6ed;max-width:650px;margin:0}.read-link{display:inline-flex;align-items:center;gap:7px;margin-top:16px;color:#fff;font-weight:850;text-decoration:none;padding:10px 13px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.14);border-radius:12px;backdrop-filter:blur(8px)}
    .rail{position:absolute;z-index:4;right:10px;bottom:calc(28px + var(--safe-bottom));display:grid;gap:12px}.rail-btn{display:grid;place-items:center;gap:3px;width:52px;border:0;background:transparent;color:#fff;font-size:11px;font-weight:750}.rail-btn .circle{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(16,18,24,.64);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);font-size:20px}.rail-btn.saved .circle{background:#fff;color:#111}.caught{height:100%;min-height:100%;scroll-snap-align:start;display:grid;place-items:center;padding:30px;text-align:center;background:linear-gradient(160deg,#0e1420,#080a0f)}.caught h2{font-size:32px;margin:0 0 10px}.caught p{color:var(--muted);line-height:1.5;max-width:430px}.caught button,.empty button{border:0;background:#fff;color:#111;border-radius:12px;padding:12px 16px;font-weight:850}
    .status-card,.empty{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.status-card div,.empty div{max-width:460px}.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin .85s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}
    dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:#11151d;color:#fff;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 24px 70px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(0,0,0,.64)}.dialog-body{padding:18px;overflow:auto;max-height:calc(100vh - 40px)}.dialog-body h2{margin:0 0 12px}.search{width:100%;border:1px solid var(--line);background:#0c0f15;color:#fff;border-radius:12px;padding:12px 13px}.settings-grid{display:grid;gap:9px;margin-top:12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d1118}.setting label{font-weight:750}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{border:1px solid var(--line);background:#171c25;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.btn.primary{background:#fff;color:#111;border-color:#fff}.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%);z-index:80;background:#fff;color:#111;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 10px 32px rgba(0,0,0,.35)}.hidden{display:none!important}
    @media(min-width:850px){.story-content{padding-left:max(40px,calc((100vw - 820px)/2));padding-right:100px}.rail{right:max(24px,calc((100vw - 920px)/2))}.source-mark{font-size:150px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" id="dashboardBtn" aria-label="Back to Dashboard">←</button>
    <div class="brand"><strong>News</strong><span id="feedStatus">For You · Live</span></div>
    <div class="top-actions"><button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button><button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></div>
    <nav class="tabs" id="tabs" aria-label="News categories">
      <button class="tab active" data-category="top">For You</button><button class="tab" data-category="us">U.S.</button><button class="tab" data-category="world">World</button><button class="tab" data-category="technology">Tech</button><button class="tab" data-category="business">Business</button><button class="tab" data-category="sports">Sports</button><button class="tab" data-category="entertainment">Entertainment</button><button class="tab" data-category="science">Science</button><button class="tab" data-category="health">Health</button><button class="tab" data-category="apple">Apple</button><button class="tab" data-category="nhl">NHL</button>
    </nav>
  </header>
  <main class="feed" id="feed"><section class="status-card"><div><div class="spinner"></div><strong>Loading your feed…</strong><p>Getting the latest stories.</p></div></section></main>
</div>

<dialog id="searchDialog"><div class="dialog-body"><h2>Search this feed</h2><input class="search" id="searchInput" placeholder="Headline, source, or topic" autocomplete="off"><div class="dialog-actions"><button class="btn" data-close="searchDialog">Close</button><button class="btn primary" id="clearSearchBtn">Clear</button></div></div></dialog>
<dialog id="settingsDialog"><div class="dialog-body"><h2>News settings</h2><div class="settings-grid"><div class="setting"><div><label for="feedStyle">Feed style</label><div style="font-size:12px;color:var(--muted)">Choose how stories are ordered.</div></div><select id="feedStyle"><option value="personalized">Personalized</option><option value="balanced">Balanced</option><option value="chronological">Chronological</option></select></div><div class="setting"><div><label for="showRead">Show stories already seen</label><div style="font-size:12px;color:var(--muted)">Turn off to reduce repeats.</div></div><input id="showRead" type="checkbox"></div></div><div class="dialog-actions"><button class="btn" id="resetHistoryBtn">Reset history</button><button class="btn primary" data-close="settingsDialog">Done</button></div></div></dialog>
<div class="toast hidden" id="toast"></div>
<script src="./news.js?v=0.1.0"></script>
</body>
</html>
