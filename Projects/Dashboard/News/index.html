<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>News · Version 0.2.0</title>
  <meta name="description" content="My Dashboard News · Version 0.2.0 · Short-Form Video News">
  <meta name="theme-color" content="#000000">
  <script src="../dashboard-config.js?v=0.9.0"></script>
  <script src="../dashboard-auth.js?v=0.9.0" data-dashboard-project="news"></script>
  <style>
    :root{--bg:#000;--text:#fff;--muted:#c9ced7;--line:rgba(255,255,255,.16);--glass:rgba(10,12,17,.55);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{height:100%;background:#000}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.video-card{position:relative;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#050505}.video-stage{position:absolute;inset:0;background:#050505;display:grid;place-items:center}.video-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58);transform:scale(1.03)}.poster.hidden{display:none}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(0,0,0,.03) 32%,rgba(0,0,0,.12) 48%,rgba(0,0,0,.86) 87%,#000 100%);pointer-events:none}.topbar{position:absolute;left:0;right:0;top:0;z-index:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:8px;padding:calc(10px + var(--safe-top)) 10px 8px;background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent)}.back,.top-btn{border:0;background:rgba(16,18,24,.58);backdrop-filter:blur(12px);color:#fff;border-radius:999px;height:42px;min-width:42px;padding:0 13px;font-weight:850}.brand{text-align:center;padding-top:4px;min-width:0}.brand strong{display:block;font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.7)}.brand span{display:block;font-size:11px;color:#e2e5eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.8)}.tabs{position:absolute;left:50%;top:calc(62px + var(--safe-top));transform:translateX(-50%);z-index:11;display:flex;gap:4px;max-width:calc(100vw - 20px);overflow:auto;padding:4px;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;color:#cfd3db;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:12px;font-weight:800}.tab.active{background:#fff;color:#111}.tap-zone{position:absolute;z-index:4;inset:110px 68px 120px 0}.pause-indicator{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);font-size:30px;opacity:0;pointer-events:none;transition:.18s}.pause-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.content{position:absolute;z-index:6;left:0;right:66px;bottom:0;padding:18px 16px calc(24px + var(--safe-bottom));text-shadow:0 2px 10px rgba(0,0,0,.78)}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:#e3e6eb;margin-bottom:8px}.source{font-weight:900}.short-badge{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.17);font-weight:850}.headline{margin:0 0 9px;font-size:clamp(22px,5.7vw,38px);line-height:1.05;letter-spacing:-.03em;font-weight:920}.summary{margin:0;color:#ecedf1;font-size:14px;line-height:1.42;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.summary.expanded{-webkit-line-clamp:unset}.more-btn{border:0;background:transparent;color:#fff;padding:6px 0 0;font-weight:850}.rail{position:absolute;z-index:8;right:8px;bottom:calc(22px + var(--safe-bottom));display:grid;gap:11px}.rail-btn{width:54px;border:0;background:transparent;color:#fff;display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.8)}.rail-btn .circle{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(12,14,19,.63);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);font-size:20px}.rail-btn.saved .circle{background:#fff;color:#111}.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18);z-index:9;overflow:hidden}.progress span{display:block;width:0;height:100%;background:#fff;transition:width .2s linear}.status-card,.empty,.caught{height:100%;min-height:100%;scroll-snap-align:start;display:grid;place-items:center;text-align:center;padding:26px;background:radial-gradient(circle at 50% 35%,#1c263b,#050608 58%)}.status-card div,.empty div,.caught div{max-width:460px}.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin .85s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}.empty button,.caught button{border:0;background:#fff;color:#111;border-radius:12px;padding:12px 16px;font-weight:850}.caught h2{font-size:30px;margin:0 0 8px}.caught p,.empty p{color:#c6ccd6;line-height:1.45}.toast{position:fixed;z-index:50;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:850;box-shadow:0 10px 30px rgba(0,0,0,.4)}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:#11151d;color:#fff;width:min(540px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 24px 70px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(0,0,0,.68)}.dialog-body{padding:18px;overflow:auto;max-height:calc(100vh - 40px)}.dialog-body h2{margin:0 0 12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.setting label{font-weight:800}.setting small{display:block;color:#aeb5c2;margin-top:3px;line-height:1.35}.btn{border:1px solid var(--line);background:#1a1f29;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.btn.primary{background:#fff;color:#111}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(min-width:800px){.content{left:max(24px,calc((100vw - 650px)/2));right:max(90px,calc((100vw - 760px)/2))}.rail{right:max(20px,calc((100vw - 760px)/2))}.video-stage iframe,.poster{left:50%;right:auto;transform:translateX(-50%);width:min(56.25vh,100vw);max-width:620px}.poster{object-fit:cover}.tap-zone{left:50%;transform:translateX(-50%);width:min(56.25vh,100vw);right:auto}}
  </style>
</head>
<body>
<div class="app">
  <main class="feed" id="feed"><section class="status-card"><div><div class="spinner"></div><strong>Loading short-form news…</strong><p>Getting the latest publisher videos.</p></div></section></main>
  <header class="topbar"><button class="back" id="dashboardBtn" aria-label="Back to Dashboard">←</button><div class="brand"><strong>News</strong><span id="feedStatus">For You · Video</span></div><button class="top-btn" id="settingsBtn">⚙</button></header>
  <nav class="tabs" id="tabs" aria-label="Video news categories"><button class="tab active" data-category="top">For You</button><button class="tab" data-category="latest">Latest</button><button class="tab" data-category="us">U.S.</button><button class="tab" data-category="world">World</button><button class="tab" data-category="technology">Tech</button><button class="tab" data-category="business">Business</button><button class="tab" data-category="sports">Sports</button><button class="tab" data-category="entertainment">Entertainment</button></nav>
</div>
<dialog id="settingsDialog"><div class="dialog-body"><h2>Video News settings</h2><div class="setting"><div><label for="defaultMuted">Start videos muted</label><small>Recommended because mobile browsers block sound autoplay.</small></div><input id="defaultMuted" type="checkbox" checked></div><div class="setting"><div><label for="showSeen">Show videos already seen</label><small>Turn this on if you want repeats to stay in the feed.</small></div><input id="showSeen" type="checkbox"></div><div class="setting"><div><label>Captions</label><small>Publisher/YouTube captions are requested automatically when available.</small></div><span>On</span></div><div class="dialog-actions"><button class="btn" id="resetHistoryBtn">Reset history</button><button class="btn primary" data-close="settingsDialog">Done</button></div></div></dialog>
<div class="toast hidden" id="toast"></div>
<script src="./news.js?v=0.2.0"></script>
</body>
</html>
