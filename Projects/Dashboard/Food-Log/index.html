<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Log · Version 0.1.1</title>

  <!-- Dashboard Dylan shared authentication and project access guard -->
  <script src="../dashboard-config.js"></script>
  <script
    src="../dashboard-auth.js"
    data-dashboard-project="food-log"
  ></script>

  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #dfe4ea;
      --accent: #4f6df5;
      --accent-soft: #eef1ff;
      --today: #f5f7ff;
      --shadow: 0 10px 30px rgba(28, 39, 60, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      visibility: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .week-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .week-label {
      min-width: 220px;
      text-align: center;
      font-weight: 700;
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .date-control label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    .date-input-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 8px 10px;
    }

    .date-input-wrap input {
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--panel);
      color: var(--text);
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(28, 39, 60, 0.08);
    }

    .table-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    tr:last-child th,
    tr:last-child td { border-bottom: 0; }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: #fafbfc;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.95rem;
      position: relative;
    }

    thead th:first-child {
      width: 120px;
      text-align: left;
      padding-left: 16px;
    }

    .day-name {
      display: block;
      font-weight: 800;
    }

    .day-date {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 4px;
      font-weight: 500;
    }

    .today-header {
      background: var(--accent-soft);
      box-shadow: inset 0 3px 0 var(--accent);
    }

    tbody th {
      width: 120px;
      padding: 0 14px;
      text-align: left;
      background: #fafbfc;
      font-size: 0.9rem;
      font-weight: 750;
      vertical-align: middle;
    }

    tbody tr { height: 112px; }

    .food-cell {
      padding: 0;
      vertical-align: top;
      background: var(--panel);
      position: relative;
    }

    .food-cell.today-cell { background: var(--today); }

    .cell-editor {
      min-height: 111px;
      width: 100%;
      padding: 13px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
      cursor: text;
    }

    .cell-editor:empty::before {
      content: "Click to add food...";
      color: #a1a7b3;
      pointer-events: none;
    }

    .cell-editor:hover {
      background: rgba(79, 109, 245, 0.035);
    }

    .cell-editor:focus {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .save-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38a169;
    }

    @media (max-width: 820px) {
      .topbar { flex-direction: column; }

      .controls-wrap {
        width: 100%;
        align-items: flex-start;
      }

      .week-controls,
      .date-control {
        justify-content: flex-start;
        width: 100%;
      }

      .week-label {
        width: 100%;
        text-align: left;
        min-width: 0;
        order: -1;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 16px, 1500px);
        padding-top: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Food Log</h1>
        <p>Click any cell to edit what was eaten.</p>
      </div>

      <div class="controls-wrap">
        <div class="week-controls">
          <button class="btn" id="prevWeek" aria-label="Previous week">←</button>
          <div class="week-label" id="weekLabel"></div>
          <button class="btn" id="nextWeek" aria-label="Next week">→</button>
          <button class="btn" id="thisWeek">Today</button>
        </div>

        <div class="date-control">
          <label for="weekStartDate">Week starts:</label>
          <div class="date-input-wrap">
            <input type="date" id="weekStartDate" />
          </div>
        </div>
      </div>
    </header>

    <section class="table-card">
      <div class="table-scroll">
        <table aria-label="Weekly food log">
          <thead>
            <tr id="headerRow">
              <th scope="col">Meal</th>
            </tr>
          </thead>

          <tbody id="foodTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="footer">
      <div class="save-status">
        <span class="save-dot"></span>
        <span id="saveStatus">Saved to your Dashboard account</span>
      </div>

      <button class="btn" id="clearWeek">Clear This Week</button>
    </div>
  </main>

  <!-- Food Log · Version 0.1.1 · Dashboard Account Integration · 2026-08-13 -->
  <script>
    /*
      Food Log · Version 0.1.1
      Dashboard Account Integration · 2026-08-13

      CHANGELOG
      Title: Dashboard Account Integration

      Description:
      Connects Food Log to Dashboard Dylan's shared authentication and project
      access system. Food entries are now loaded and saved per signed-in
      Dashboard account through Supabase instead of being stored only in the
      current browser.

      Bug Fixes:
      - Uses ../dashboard-config.js and ../dashboard-auth.js.
      - Enforces access to the "food-log" project before showing the page.
      - Sends logged-out users through the centralized Dashboard login flow.
      - Sends users without Food Log permission back to the Dashboard.
      - Saves each user's entries to public.food_logs with RLS protection.
    */

    const ROWS = [
      "Meal 1",
      "Snack 1",
      "Meal 2",
      "Snack 2",
      "Meal 3",
      "Snack 3"
    ];

    const START_DATE_KEY = "food-log-start-date";
    const SAVE_DELAY_MS = 500;

    let supabaseClient = null;
    let dashboardUser = null;
    let currentWeekStart = loadStartDate();
    let currentWeekEntries = {};
    let renderGeneration = 0;
    const pendingSaves = new Map();

    function normalizeDate(date) {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      return d;
    }

    function loadStartDate() {
      const saved = localStorage.getItem(START_DATE_KEY);

      if (saved) {
        const parts = saved.split("-").map(Number);

        if (parts.length === 3) {
          return normalizeDate(
            new Date(parts[0], parts[1] - 1, parts[2])
          );
        }
      }

      return normalizeDate(new Date());
    }

    function saveStartDate() {
      localStorage.setItem(
        START_DATE_KEY,
        dateKey(currentWeekStart)
      );
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getWeekDates() {
      const dates = [];

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(date.getDate() + i);
        dates.push(date);
      }

      return dates;
    }

    function getWeekEnd() {
      const end = new Date(currentWeekStart);
      end.setDate(end.getDate() + 6);
      return normalizeDate(end);
    }

    function formatWeekLabel(start) {
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      const startMonth = start.toLocaleDateString(
        undefined,
        { month: "short" }
      );

      const endMonth = end.toLocaleDateString(
        undefined,
        { month: "short" }
      );

      if (
        start.getMonth() === end.getMonth() &&
        start.getFullYear() === end.getFullYear()
      ) {
        return `${startMonth} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
      }

      if (start.getFullYear() === end.getFullYear()) {
        return `${startMonth} ${start.getDate()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
      }

      return `${startMonth} ${start.getDate()}, ${start.getFullYear()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }

    function entryKey(entryDate, slotIndex) {
      return `${entryDate}__${slotIndex}`;
    }

    function setSaveStatus(message, isError = false) {
      const status = document.getElementById("saveStatus");
      const dot = document.querySelector(".save-dot");

      status.textContent = message;

      if (dot) {
        dot.style.background = isError ? "#b3261e" : "#38a169";
      }
    }

    async function loadWeekEntries() {
      const generation = ++renderGeneration;
      setSaveStatus("Loading…");

      const start = dateKey(currentWeekStart);
      const end = dateKey(getWeekEnd());

      const { data, error } = await supabaseClient
        .from("food_logs")
        .select("entry_date,slot_index,food_text")
        .eq("user_id", dashboardUser.id)
        .gte("entry_date", start)
        .lte("entry_date", end)
        .order("entry_date", { ascending: true })
        .order("slot_index", { ascending: true });

      if (generation !== renderGeneration) {
        return false;
      }

      if (error) {
        console.error("Food Log load:", error);
        currentWeekEntries = {};
        setSaveStatus(
          "Could not load this week",
          true
        );
        return false;
      }

      currentWeekEntries = {};

      (data || []).forEach(row => {
        currentWeekEntries[
          entryKey(row.entry_date, row.slot_index)
        ] = row.food_text || "";
      });

      setSaveStatus("Saved to your Dashboard account");
      return true;
    }

    async function persistCell(entryDate, slotIndex, foodText) {
      const trimmedText = String(foodText || "").trim();
      setSaveStatus("Saving…");

      try {
        if (!trimmedText) {
          const { error } = await supabaseClient
            .from("food_logs")
            .delete()
            .eq("user_id", dashboardUser.id)
            .eq("entry_date", entryDate)
            .eq("slot_index", slotIndex);

          if (error) throw error;

          delete currentWeekEntries[
            entryKey(entryDate, slotIndex)
          ];
        } else {
          const { error } = await supabaseClient
            .from("food_logs")
            .upsert(
              {
                user_id: dashboardUser.id,
                week_start: dateKey(currentWeekStart),
                entry_date: entryDate,
                slot_index: slotIndex,
                food_text: foodText,
                updated_at: new Date().toISOString()
              },
              {
                onConflict: "user_id,entry_date,slot_index"
              }
            );

          if (error) throw error;

          currentWeekEntries[
            entryKey(entryDate, slotIndex)
          ] = foodText;
        }

        setSaveStatus("Saved to your Dashboard account");
      } catch (error) {
        console.error("Food Log save:", error);
        setSaveStatus("Save failed", true);
      }
    }

    function scheduleCellSave(entryDate, slotIndex, foodText) {
      const key = entryKey(entryDate, slotIndex);

      if (pendingSaves.has(key)) {
        clearTimeout(pendingSaves.get(key));
      }

      pendingSaves.set(
        key,
        setTimeout(async () => {
          pendingSaves.delete(key);
          await persistCell(
            entryDate,
            slotIndex,
            foodText
          );
        }, SAVE_DELAY_MS)
      );
    }

    async function render() {
      const dates = getWeekDates();
      const today = dateKey(new Date());

      document.getElementById("weekLabel").textContent =
        formatWeekLabel(currentWeekStart);

      document.getElementById("weekStartDate").value =
        dateKey(currentWeekStart);

      const headerRow =
        document.getElementById("headerRow");

      headerRow.innerHTML =
        `<th scope="col">Meal</th>`;

      dates.forEach(date => {
        const th = document.createElement("th");
        th.scope = "col";

        if (dateKey(date) === today) {
          th.classList.add("today-header");
        }

        th.innerHTML = `
          <span class="day-name">
            ${date.toLocaleDateString(
              undefined,
              { weekday: "long" }
            )}
          </span>
          <span class="day-date">
            ${date.toLocaleDateString(
              undefined,
              {
                month: "short",
                day: "numeric"
              }
            )}
          </span>
        `;

        headerRow.appendChild(th);
      });

      const body =
        document.getElementById("foodTableBody");

      body.innerHTML = "";

      ROWS.forEach((rowName, rowIndex) => {
        const tr = document.createElement("tr");

        const rowHeader =
          document.createElement("th");

        rowHeader.scope = "row";
        rowHeader.textContent = rowName;
        tr.appendChild(rowHeader);

        dates.forEach(date => {
          const dKey = dateKey(date);
          const key = entryKey(dKey, rowIndex);

          const td = document.createElement("td");
          td.className = "food-cell";

          if (dKey === today) {
            td.classList.add("today-cell");
          }

          const editor =
            document.createElement("div");

          editor.className = "cell-editor";
          editor.contentEditable = "true";
          editor.setAttribute("role", "textbox");
          editor.setAttribute(
            "aria-label",
            `${rowName}, ${date.toLocaleDateString()}`
          );
          editor.spellcheck = true;
          editor.textContent =
            currentWeekEntries[key] || "";

          editor.addEventListener("input", () => {
            scheduleCellSave(
              dKey,
              rowIndex,
              editor.innerText
            );
          });

          editor.addEventListener(
            "keydown",
            event => {
              if (event.key === "Escape") {
                editor.blur();
              }
            }
          );

          td.appendChild(editor);
          tr.appendChild(td);
        });

        body.appendChild(tr);
      });
    }

    async function changeWeek(nextStart) {
      currentWeekStart = normalizeDate(nextStart);
      saveStartDate();

      await loadWeekEntries();
      await render();
    }

    document
      .getElementById("weekStartDate")
      .addEventListener(
        "change",
        async event => {
          const value = event.target.value;

          if (!value) return;

          const [year, month, day] =
            value.split("-").map(Number);

          await changeWeek(
            new Date(year, month - 1, day)
          );
        }
      );

    document
      .getElementById("prevWeek")
      .addEventListener(
        "click",
        async () => {
          const next = new Date(currentWeekStart);
          next.setDate(next.getDate() - 7);
          await changeWeek(next);
        }
      );

    document
      .getElementById("nextWeek")
      .addEventListener(
        "click",
        async () => {
          const next = new Date(currentWeekStart);
          next.setDate(next.getDate() + 7);
          await changeWeek(next);
        }
      );

    document
      .getElementById("thisWeek")
      .addEventListener(
        "click",
        async () => {
          await changeWeek(new Date());
        }
      );

    document
      .getElementById("clearWeek")
      .addEventListener(
        "click",
        async () => {
          const label =
            formatWeekLabel(currentWeekStart);

          if (
            !confirm(
              `Clear every food entry for ${label}?`
            )
          ) {
            return;
          }

          const start = dateKey(currentWeekStart);
          const end = dateKey(getWeekEnd());

          setSaveStatus("Clearing…");

          const { error } = await supabaseClient
            .from("food_logs")
            .delete()
            .eq("user_id", dashboardUser.id)
            .gte("entry_date", start)
            .lte("entry_date", end);

          if (error) {
            console.error(
              "Food Log clear week:",
              error
            );

            setSaveStatus(
              "Could not clear this week",
              true
            );

            return;
          }

          currentWeekEntries = {};
          await render();
          setSaveStatus(
            "Saved to your Dashboard account"
          );
        }
      );

    async function initializeFoodLog() {
      supabaseClient =
        window.DashboardAuth?.client || null;

      dashboardUser =
        window.DashboardAuth?.user || null;

      if (!supabaseClient || !dashboardUser) {
        return;
      }

      await loadWeekEntries();
      await render();

      document.body.style.visibility = "visible";
    }

    window.addEventListener(
      "dashboard-auth-ready",
      initializeFoodLog,
      { once: true }
    );

    if (
      window.DashboardAuth?.client &&
      window.DashboardAuth?.user
    ) {
      initializeFoodLog();
    }
  </script>
</body>
</html>
