<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Log · Version 0.1.0</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #dfe4ea;
      --accent: #4f6df5;
      --accent-soft: #eef1ff;
      --today: #f5f7ff;
      --shadow: 0 10px 30px rgba(28, 39, 60, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .week-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .week-label {
      min-width: 220px;
      text-align: center;
      font-weight: 700;
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .date-control label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    .date-input-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 8px 10px;
    }

    .date-input-wrap input {
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--panel);
      color: var(--text);
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(28, 39, 60, 0.08);
    }

    .table-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    tr:last-child th,
    tr:last-child td { border-bottom: 0; }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: #fafbfc;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.95rem;
      position: relative;
    }

    thead th:first-child {
      width: 120px;
      text-align: left;
      padding-left: 16px;
    }

    .day-name {
      display: block;
      font-weight: 800;
    }

    .day-date {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 4px;
      font-weight: 500;
    }

    .today-header {
      background: var(--accent-soft);
      box-shadow: inset 0 3px 0 var(--accent);
    }

    tbody th {
      width: 120px;
      padding: 0 14px;
      text-align: left;
      background: #fafbfc;
      font-size: 0.9rem;
      font-weight: 750;
      vertical-align: middle;
    }

    tbody tr { height: 112px; }

    .food-cell {
      padding: 0;
      vertical-align: top;
      background: var(--panel);
      position: relative;
    }

    .food-cell.today-cell { background: var(--today); }

    .cell-editor {
      min-height: 111px;
      width: 100%;
      padding: 13px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
      cursor: text;
    }

    .cell-editor:empty::before {
      content: "Click to add food...";
      color: #a1a7b3;
      pointer-events: none;
    }

    .cell-editor:hover {
      background: rgba(79, 109, 245, 0.035);
    }

    .cell-editor:focus {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .save-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38a169;
    }

    @media (max-width: 820px) {
      .topbar { flex-direction: column; }

      .controls-wrap {
        width: 100%;
        align-items: flex-start;
      }

      .week-controls,
      .date-control {
        justify-content: flex-start;
        width: 100%;
      }

      .week-label {
        width: 100%;
        text-align: left;
        min-width: 0;
        order: -1;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 16px, 1500px);
        padding-top: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Food Log</h1>
        <p>Click any cell to edit what was eaten.</p>
      </div>

      <div class="controls-wrap">
        <div class="week-controls">
          <button class="btn" id="prevWeek" aria-label="Previous week">←</button>
          <div class="week-label" id="weekLabel"></div>
          <button class="btn" id="nextWeek" aria-label="Next week">→</button>
          <button class="btn" id="thisWeek">Today</button>
        </div>

        <div class="date-control">
          <label for="weekStartDate">Week starts:</label>
          <div class="date-input-wrap">
            <input type="date" id="weekStartDate" />
          </div>
        </div>
      </div>
    </header>

    <section class="table-card">
      <div class="table-scroll">
        <table aria-label="Weekly food log">
          <thead>
            <tr id="headerRow">
              <th scope="col">Meal</th>
            </tr>
          </thead>

          <tbody id="foodTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="footer">
      <div class="save-status">
        <span class="save-dot"></span>
        <span id="saveStatus">Saved automatically on this device</span>
      </div>

      <button class="btn" id="clearWeek">Clear This Week</button>
    </div>
  </main>

  <!-- Food Log · Version 0.1.0 · Initial Food Log Release -->
  <script>
    const STORAGE_KEY = "food-log-table-v2";
    const START_DATE_KEY = "food-log-start-date";

    const ROWS = [
      "Meal 1",
      "Snack 1",
      "Meal 2",
      "Snack 2",
      "Meal 3",
      "Snack 3"
    ];

    let data = loadData();
    let currentWeekStart = loadStartDate();

    function normalizeDate(date) {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      return d;
    }

    function loadStartDate() {
      const saved = localStorage.getItem(START_DATE_KEY);

      if (saved) {
        const parts = saved.split("-").map(Number);
        if (parts.length === 3) {
          return normalizeDate(new Date(parts[0], parts[1] - 1, parts[2]));
        }
      }

      return normalizeDate(new Date());
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function weekKey() {
      return dateKey(currentWeekStart);
    }

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      const status = document.getElementById("saveStatus");
      status.textContent = "Saved";

      clearTimeout(window.saveStatusTimer);

      window.saveStatusTimer = setTimeout(() => {
        status.textContent = "Saved automatically on this device";
      }, 900);
    }

    function saveStartDate() {
      localStorage.setItem(START_DATE_KEY, dateKey(currentWeekStart));
    }

    function ensureWeek() {
      const key = weekKey();

      if (!data[key]) {
        data[key] = {};
      }

      return data[key];
    }

    function formatWeekLabel(start) {
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      const startMonth = start.toLocaleDateString(undefined, { month: "short" });
      const endMonth = end.toLocaleDateString(undefined, { month: "short" });

      if (
        start.getMonth() === end.getMonth() &&
        start.getFullYear() === end.getFullYear()
      ) {
        return `${startMonth} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
      }

      if (start.getFullYear() === end.getFullYear()) {
        return `${startMonth} ${start.getDate()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
      }

      return `${startMonth} ${start.getDate()}, ${start.getFullYear()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }

    function getWeekDates() {
      const dates = [];

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(date.getDate() + i);
        dates.push(date);
      }

      return dates;
    }

    function render() {
      const dates = getWeekDates();
      const today = dateKey(new Date());
      const week = ensureWeek();

      document.getElementById("weekLabel").textContent =
        formatWeekLabel(currentWeekStart);

      document.getElementById("weekStartDate").value =
        dateKey(currentWeekStart);

      const headerRow = document.getElementById("headerRow");
      headerRow.innerHTML = `<th scope="col">Meal</th>`;

      dates.forEach(date => {
        const th = document.createElement("th");
        th.scope = "col";

        if (dateKey(date) === today) {
          th.classList.add("today-header");
        }

        th.innerHTML = `
          <span class="day-name">
            ${date.toLocaleDateString(undefined, { weekday: "long" })}
          </span>
          <span class="day-date">
            ${date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}
          </span>
        `;

        headerRow.appendChild(th);
      });

      const body = document.getElementById("foodTableBody");
      body.innerHTML = "";

      ROWS.forEach((rowName, rowIndex) => {
        const tr = document.createElement("tr");

        const rowHeader = document.createElement("th");
        rowHeader.scope = "row";
        rowHeader.textContent = rowName;
        tr.appendChild(rowHeader);

        dates.forEach(date => {
          const dKey = dateKey(date);
          const cellKey = `${dKey}__${rowIndex}`;

          const td = document.createElement("td");
          td.className = "food-cell";

          if (dKey === today) {
            td.classList.add("today-cell");
          }

          const editor = document.createElement("div");
          editor.className = "cell-editor";
          editor.contentEditable = "true";
          editor.setAttribute("role", "textbox");
          editor.setAttribute("aria-label", `${rowName}, ${date.toLocaleDateString()}`);
          editor.spellcheck = true;
          editor.textContent = week[cellKey] || "";

          editor.addEventListener("input", () => {
            week[cellKey] = editor.innerText;
            saveData();
          });

          editor.addEventListener("keydown", event => {
            if (event.key === "Escape") {
              editor.blur();
            }
          });

          td.appendChild(editor);
          tr.appendChild(td);
        });

        body.appendChild(tr);
      });
    }

    document.getElementById("weekStartDate").addEventListener("change", event => {
      const value = event.target.value;
      if (!value) return;

      const [year, month, day] = value.split("-").map(Number);
      currentWeekStart = normalizeDate(new Date(year, month - 1, day));

      saveStartDate();
      render();
    });

    document.getElementById("prevWeek").addEventListener("click", () => {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      currentWeekStart = normalizeDate(currentWeekStart);
      saveStartDate();
      render();
    });

    document.getElementById("nextWeek").addEventListener("click", () => {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      currentWeekStart = normalizeDate(currentWeekStart);
      saveStartDate();
      render();
    });

    document.getElementById("thisWeek").addEventListener("click", () => {
      currentWeekStart = normalizeDate(new Date());
      saveStartDate();
      render();
    });

    document.getElementById("clearWeek").addEventListener("click", () => {
      const label = formatWeekLabel(currentWeekStart);

      if (!confirm(`Clear every food entry for ${label}?`)) {
        return;
      }

      delete data[weekKey()];
      saveData();
      render();
    });

    render();
  </script>
</body>
</html>
