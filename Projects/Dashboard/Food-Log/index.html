<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Log · Version 0.1.1</title>

  <!-- Dashboard Dylan shared authentication guard -->
  <script>
    // Food Log 0.1.1 authentication gate:
    // keep the page hidden until Dashboard authentication confirms a user.
    document.documentElement.style.visibility = "hidden";

    window.__foodLogAuthTimeout = setTimeout(() => {
      window.location.replace("../Dashboard/");
    }, 5000);
  </script>

  <script
    src="../Dashboard/dashboard-auth.js"
    onerror="window.location.replace('../Dashboard/');">
  </script>

  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #dfe4ea;
      --accent: #4f6df5;
      --accent-soft: #eef1ff;
      --today: #f5f7ff;
      --shadow: 0 10px 30px rgba(28, 39, 60, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .week-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .week-label {
      min-width: 220px;
      text-align: center;
      font-weight: 700;
    }

    .date-control {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .date-control label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    .date-input-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 8px 10px;
    }

    .date-input-wrap input {
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--panel);
      color: var(--text);
      transition: 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(28, 39, 60, 0.08);
    }

    .table-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    tr:last-child th,
    tr:last-child td { border-bottom: 0; }

    th:last-child,
    td:last-child { border-right: 0; }

    thead th {
      background: #fafbfc;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.95rem;
      position: relative;
    }

    thead th:first-child {
      width: 120px;
      text-align: left;
      padding-left: 16px;
    }

    .day-name {
      display: block;
      font-weight: 800;
    }

    .day-date {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 4px;
      font-weight: 500;
    }

    .today-header {
      background: var(--accent-soft);
      box-shadow: inset 0 3px 0 var(--accent);
    }

    tbody th {
      width: 120px;
      padding: 0 14px;
      text-align: left;
      background: #fafbfc;
      font-size: 0.9rem;
      font-weight: 750;
      vertical-align: middle;
    }

    tbody tr { height: 112px; }

    .food-cell {
      padding: 0;
      vertical-align: top;
      background: var(--panel);
      position: relative;
    }

    .food-cell.today-cell { background: var(--today); }

    .cell-editor {
      min-height: 111px;
      width: 100%;
      padding: 13px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
      cursor: text;
    }

    .cell-editor:empty::before {
      content: "Click to add food...";
      color: #a1a7b3;
      pointer-events: none;
    }

    .cell-editor:hover {
      background: rgba(79, 109, 245, 0.035);
    }

    .cell-editor:focus {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .cell-editor[contenteditable="false"] {
      cursor: default;
      opacity: 0.65;
    }

    .save-dot.loading { background: #d69e2e; }
    .save-dot.error { background: #c53030; }

    .access-error {
      margin: 18px 0 0;
      padding: 14px 16px;
      border: 1px solid #efb4b4;
      border-radius: 12px;
      background: #fff5f5;
      color: #9b2c2c;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .save-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38a169;
    }

    @media (max-width: 820px) {
      .topbar { flex-direction: column; }

      .controls-wrap {
        width: 100%;
        align-items: flex-start;
      }

      .week-controls,
      .date-control {
        justify-content: flex-start;
        width: 100%;
      }

      .week-label {
        width: 100%;
        text-align: left;
        min-width: 0;
        order: -1;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 16px, 1500px);
        padding-top: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>Food Log</h1>
        <p>Click any cell to edit what was eaten. <span id="accountLabel"></span></p>
      </div>

      <div class="controls-wrap">
        <div class="week-controls">
          <button class="btn" id="prevWeek" aria-label="Previous week">←</button>
          <div class="week-label" id="weekLabel"></div>
          <button class="btn" id="nextWeek" aria-label="Next week">→</button>
          <button class="btn" id="thisWeek">Today</button>
        </div>

        <div class="date-control">
          <label for="weekStartDate">Week starts:</label>
          <div class="date-input-wrap">
            <input type="date" id="weekStartDate" />
          </div>
        </div>
      </div>
    </header>

    <section class="table-card">
      <div class="table-scroll">
        <table aria-label="Weekly food log">
          <thead>
            <tr id="headerRow">
              <th scope="col">Meal</th>
            </tr>
          </thead>

          <tbody id="foodTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="footer">
      <div class="save-status">
        <span class="save-dot"></span>
        <span id="saveStatus">Connecting to your Dashboard account…</span>
      </div>

      <button class="btn" id="clearWeek">Clear This Week</button>
    </div>
  </main>

  <script>
    /*
      Dashboard Dylan · Food Log · Version 0.1.1
      Dashboard Login Connection · 2026-08-11

      CHANGELOG
      Title: Dashboard Login Connection
      Description:
      Connects Food Log to Dashboard Dylan's shared login/authentication
      experience so the project uses the same signed-in Dashboard account.
      Account-specific food data continues to be handled by the backend. The
      existing seven-day by six-row layout, week navigation, custom week start,
      Today button, Clear This Week action, and automatic saving are preserved.
      Direct project access is also checked against Dashboard Dylan's current
      project/group permissions before food data loads.

      IMPORTANT:
      Existing localStorage food entries are not automatically imported. That
      avoids accidentally assigning old device data to whichever account happens
      to be signed in when this version is first opened.
    */

    const START_DATE_KEY = "mindi-weekly-food-start-date";
    const PROJECT_ID = "food-log";

    const ROWS = [
      "Meal 1",
      "Snack 1",
      "Meal 2",
      "Snack 2",
      "Meal 3",
      "Snack 3"
    ];

    let currentWeekStart = loadStartDate();
    let currentUser = null;
    let supabaseClient = null;
    let weekData = {};
    let loadSequence = 0;
    const saveTimers = new Map();

    function normalizeDate(date) {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      return d;
    }

    function loadStartDate() {
      const saved = localStorage.getItem(START_DATE_KEY);

      if (saved) {
        const parts = saved.split("-").map(Number);
        if (parts.length === 3) {
          return normalizeDate(new Date(parts[0], parts[1] - 1, parts[2]));
        }
      }

      return normalizeDate(new Date());
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function saveStartDate() {
      localStorage.setItem(START_DATE_KEY, dateKey(currentWeekStart));
    }

    function setSaveStatus(message, state = "saved") {
      const status = document.getElementById("saveStatus");
      const dot = document.querySelector(".save-dot");

      status.textContent = message;
      dot.classList.toggle("loading", state === "loading");
      dot.classList.toggle("error", state === "error");
    }

    function makeCellKey(entryDate, rowIndex) {
      return `${entryDate}__${rowIndex}`;
    }

    function formatWeekLabel(start) {
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      const startMonth = start.toLocaleDateString(undefined, { month: "short" });
      const endMonth = end.toLocaleDateString(undefined, { month: "short" });

      if (
        start.getMonth() === end.getMonth() &&
        start.getFullYear() === end.getFullYear()
      ) {
        return `${startMonth} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`;
      }

      if (start.getFullYear() === end.getFullYear()) {
        return `${startMonth} ${start.getDate()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
      }

      return `${startMonth} ${start.getDate()}, ${start.getFullYear()} – ${endMonth} ${end.getDate()}, ${end.getFullYear()}`;
    }

    function getWeekDates() {
      const dates = [];

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(date.getDate() + i);
        dates.push(date);
      }

      return dates;
    }

    function getWeekDateRange() {
      const dates = getWeekDates();
      return {
        start: dateKey(dates[0]),
        end: dateKey(dates[6])
      };
    }

    function setEditorsEnabled(enabled) {
      document.querySelectorAll(".cell-editor").forEach(editor => {
        editor.contentEditable = enabled ? "true" : "false";
      });
      document.getElementById("clearWeek").disabled = !enabled;
    }

    function render() {
      const dates = getWeekDates();
      const today = dateKey(new Date());

      document.getElementById("weekLabel").textContent =
        formatWeekLabel(currentWeekStart);

      document.getElementById("weekStartDate").value =
        dateKey(currentWeekStart);

      const headerRow = document.getElementById("headerRow");
      headerRow.innerHTML = `<th scope="col">Meal</th>`;

      dates.forEach(date => {
        const th = document.createElement("th");
        th.scope = "col";

        if (dateKey(date) === today) {
          th.classList.add("today-header");
        }

        th.innerHTML = `
          <span class="day-name">
            ${date.toLocaleDateString(undefined, { weekday: "long" })}
          </span>
          <span class="day-date">
            ${date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}
          </span>
        `;

        headerRow.appendChild(th);
      });

      const body = document.getElementById("foodTableBody");
      body.innerHTML = "";

      ROWS.forEach((rowName, rowIndex) => {
        const tr = document.createElement("tr");

        const rowHeader = document.createElement("th");
        rowHeader.scope = "row";
        rowHeader.textContent = rowName;
        tr.appendChild(rowHeader);

        dates.forEach(date => {
          const entryDate = dateKey(date);
          const key = makeCellKey(entryDate, rowIndex);

          const td = document.createElement("td");
          td.className = "food-cell";

          if (entryDate === today) {
            td.classList.add("today-cell");
          }

          const editor = document.createElement("div");
          editor.className = "cell-editor";
          editor.contentEditable = currentUser ? "true" : "false";
          editor.setAttribute("role", "textbox");
          editor.setAttribute("aria-label", `${rowName}, ${date.toLocaleDateString()}`);
          editor.spellcheck = true;
          editor.textContent = weekData[key] || "";

          editor.addEventListener("input", () => {
            weekData[key] = editor.innerText;
            scheduleCellSave(entryDate, rowIndex, editor.innerText);
          });

          editor.addEventListener("keydown", event => {
            if (event.key === "Escape") {
              editor.blur();
            }
          });

          editor.addEventListener("blur", () => {
            flushCellSave(entryDate, rowIndex, editor.innerText);
          });

          td.appendChild(editor);
          tr.appendChild(td);
        });

        body.appendChild(tr);
      });
    }

    function waitForDashboardAuth() {
      if (window.DashboardAuth?.client && window.DashboardAuth?.user) {
        return Promise.resolve(window.DashboardAuth);
      }

      return new Promise(resolve => {
        const handler = () => {
          window.removeEventListener("dashboard-auth-ready", handler);
          resolve(window.DashboardAuth);
        };
        window.addEventListener("dashboard-auth-ready", handler, { once: true });
      });
    }

    function revealFoodLogAfterAuth() {
      clearTimeout(window.__foodLogAuthTimeout);
      document.documentElement.style.visibility = "";
    }

    function redirectToDashboardLogin() {
      clearTimeout(window.__foodLogAuthTimeout);
      window.location.replace("../Dashboard/");
    }

    async function verifyProjectAccess() {
      const { data, error } = await supabaseClient.rpc(
        "can_access_dashboard_project",
        { requested_project_id: PROJECT_ID }
      );

      if (error) {
        console.error("Project access check:", error);
        throw new Error(
          "Food Log access could not be verified. Make sure the current Dashboard Supabase setup has been run."
        );
      }

      if (data !== true) {
        document.querySelector(".table-card").hidden = true;
        document.querySelector(".footer").hidden = true;

        const message = document.createElement("div");
        message.className = "access-error";
        message.textContent = "This Dashboard account does not have access to Food Log.";
        document.querySelector(".topbar").after(message);

        throw new Error("This account does not have access to Food Log.");
      }
    }

    async function loadCurrentWeek() {
      if (!supabaseClient || !currentUser) return;

      const requestId = ++loadSequence;
      const range = getWeekDateRange();

      setEditorsEnabled(false);
      setSaveStatus("Loading your food log…", "loading");

      const { data, error } = await supabaseClient
        .from("food_log_entries")
        .select("entry_date,slot_index,food_text")
        .gte("entry_date", range.start)
        .lte("entry_date", range.end)
        .order("entry_date")
        .order("slot_index");

      if (requestId !== loadSequence) return;

      if (error) {
        console.error("Food Log load:", error);
        setSaveStatus(
          "Could not load your food log. Run the Food Log Supabase setup.",
          "error"
        );
        render();
        setEditorsEnabled(false);
        return;
      }

      weekData = {};
      (data || []).forEach(row => {
        weekData[makeCellKey(row.entry_date, Number(row.slot_index))] =
          row.food_text || "";
      });

      render();
      setEditorsEnabled(true);
      setSaveStatus("Saved to your Dashboard account");
    }

    function scheduleCellSave(entryDate, rowIndex, value) {
      const key = makeCellKey(entryDate, rowIndex);
      clearTimeout(saveTimers.get(key));
      setSaveStatus("Saving…", "loading");

      const timer = setTimeout(() => {
        saveTimers.delete(key);
        saveCell(entryDate, rowIndex, value);
      }, 450);

      saveTimers.set(key, timer);
    }

    async function flushCellSave(entryDate, rowIndex, value) {
      const key = makeCellKey(entryDate, rowIndex);
      if (!saveTimers.has(key)) return;

      clearTimeout(saveTimers.get(key));
      saveTimers.delete(key);
      await saveCell(entryDate, rowIndex, value);
    }

    async function saveCell(entryDate, rowIndex, value) {
      if (!supabaseClient || !currentUser) return;

      const foodText = String(value || "").trimEnd();

      try {
        if (!foodText.trim()) {
          const { error } = await supabaseClient
            .from("food_log_entries")
            .delete()
            .eq("entry_date", entryDate)
            .eq("slot_index", rowIndex);

          if (error) throw error;
          delete weekData[makeCellKey(entryDate, rowIndex)];
        } else {
          const { error } = await supabaseClient
            .from("food_log_entries")
            .upsert(
              {
                user_id: currentUser.id,
                entry_date: entryDate,
                slot_index: rowIndex,
                food_text: foodText,
                updated_at: new Date().toISOString()
              },
              { onConflict: "user_id,entry_date,slot_index" }
            );

          if (error) throw error;
          weekData[makeCellKey(entryDate, rowIndex)] = foodText;
        }

        setSaveStatus("Saved to your Dashboard account");
      } catch (error) {
        console.error("Food Log save:", error);
        setSaveStatus("Save failed. Your last edit may not be stored.", "error");
      }
    }

    async function clearCurrentWeek() {
      const label = formatWeekLabel(currentWeekStart);

      if (!confirm(`Clear every food entry for ${label}?`)) {
        return;
      }

      const range = getWeekDateRange();
      setSaveStatus("Clearing this week…", "loading");
      document.getElementById("clearWeek").disabled = true;

      try {
        const { error } = await supabaseClient
          .from("food_log_entries")
          .delete()
          .gte("entry_date", range.start)
          .lte("entry_date", range.end);

        if (error) throw error;

        weekData = {};
        render();
        setEditorsEnabled(true);
        setSaveStatus("Week cleared");
      } catch (error) {
        console.error("Food Log clear:", error);
        setSaveStatus("This week could not be cleared.", "error");
        setEditorsEnabled(true);
      }
    }

    async function changeWeek(nextStart) {
      currentWeekStart = normalizeDate(nextStart);
      saveStartDate();
      weekData = {};
      render();
      await loadCurrentWeek();
    }

    document.getElementById("weekStartDate").addEventListener("change", async event => {
      const value = event.target.value;
      if (!value) return;

      const [year, month, day] = value.split("-").map(Number);
      await changeWeek(new Date(year, month - 1, day));
    });

    document.getElementById("prevWeek").addEventListener("click", async () => {
      const next = new Date(currentWeekStart);
      next.setDate(next.getDate() - 7);
      await changeWeek(next);
    });

    document.getElementById("nextWeek").addEventListener("click", async () => {
      const next = new Date(currentWeekStart);
      next.setDate(next.getDate() + 7);
      await changeWeek(next);
    });

    document.getElementById("thisWeek").addEventListener("click", async () => {
      await changeWeek(new Date());
    });

    document.getElementById("clearWeek").addEventListener("click", clearCurrentWeek);

    async function initializeFoodLog() {
      render();
      setEditorsEnabled(false);

      try {
        const auth = await waitForDashboardAuth();

        if (!auth?.client || !auth?.user) {
          redirectToDashboardLogin();
          return;
        }

        supabaseClient = auth.client;
        currentUser = auth.user;

        const accountLabel = document.getElementById("accountLabel");
        accountLabel.textContent = currentUser.email
          ? `Signed in as ${currentUser.email}.`
          : "Connected to your Dashboard account.";

        await verifyProjectAccess();
        revealFoodLogAfterAuth();
        await loadCurrentWeek();
      } catch (error) {
        console.error("Food Log initialization:", error);

        if (!currentUser) {
          redirectToDashboardLogin();
          return;
        }

        revealFoodLogAfterAuth();
        setEditorsEnabled(false);
        setSaveStatus(error.message || "Food Log could not initialize.", "error");
      }
    }

    initializeFoodLog();
  </script>
</body>
</html>
