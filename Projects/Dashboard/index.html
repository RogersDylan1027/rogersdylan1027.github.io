      TV Season & Episode Selection + My Dashboard Rebrand · 2026-08-14

      CHANGELOG
      Title:
      Project Access Enforcement & Shared Auth Alignment

      Description:
      Aligns protected Dashboard projects with the shared authentication layer
      introduced in 0.5.4. Project pages now use the centralized Dashboard
      session and project-access checks consistently, and an account that does
      not have permission for a requested project is returned to the Dashboard
      instead of leaving the protected page visible.

      Bug Fixes:
      - Sends project-access denials back to Dashboard/index.html.
      - Keeps unauthenticated project requests routed through login.html with a
        same-origin return target.
      - Aligns protected projects with the shared Dashboard auth/config files.
      - Preserves projects.json as the single project catalog.
      - Corrects the Login path wording to Dashboard/login.html.

      ARCHITECTURE NOTE
      My Dashboard still uses the immutable Version 0.4.2 source as the
      preserved full-feature base. The patch below layers the Projects Hub,
      project groups/access controls, projects.json-only behavior, and the
      0.5.5 shared-auth/project-access integration over that base.

      The historical source URL intentionally retains Projects/Custom-UI
      because commit fa797e4 predates the live folder rename.
    */

      "https://raw.githubusercontent.com/RogersDylan1027/rogersdylan1027.github.io/fa797e4/Projects/Custom-UI/index.html";

    function replaceRequired(source, find, replacement, label) {
      if (!source.includes(find)) {
        throw new Error("0.5.5 patch could not find: " + label);
      }

      return source.replace(find, replacement);
    }

    function apply054Patch(source) {

        VERSION

        throw new Error("0.6.6 patch could not find: page version title");

      source = replaceRequired(

      /*

      */

      );

      source = replaceRequired(

        'if(info.url==="#files")tile.addEventListener("click",e=>{e.preventDefault();openFilesView();});if(info.url==="#projects")tile.addEventListener("click",e=>{e.preventDefault();openProjectsView();});if(info.url==="#changelog")',
        "Projects tile click handler"
      );

      /*
        PROJECTS / GROUP ACCESS SCRIPT

        0.5.3 RULE:
        projects.json is the ONLY project catalog. There is no fallback list.
      */
      const projectsScript = `

    let dashboardProjectAccess = {};
    let dashboardGroups = [];
    let dashboardGroupMembers = [];
    let dashboardUsers = [];
    let currentDashboardGroupIds = new Set();

    function normalizeDashboardProjects(value) {
      if (!Array.isArray(value)) {
        throw new Error("projects.json must contain a JSON array.");
      }

      return value.map((project, index) => {
        if (!project || typeof project !== "object") {
          throw new Error(
            "Project #" + (index + 1) + " is not a valid object."
          );
        }

        if (typeof project.name !== "string" || !project.name.trim()) {
          throw new Error(
            "Project #" + (index + 1) + " is missing a valid name."
          );
        }

        const hasUrl =
          typeof project.url === "string" &&
          project.url.trim();

        const hasFolder =
          typeof project.folder === "string" &&
          project.folder.trim();

        if (!hasUrl && !hasFolder) {
          throw new Error(
            project.name + " is missing both folder and url."
          );
        }

        return {
          id: String(project.id || project.name).trim(),
          name: project.name.trim(),
          folder: hasFolder ? project.folder.trim() : "",
          url: hasUrl ? project.url.trim() : "",
          icon:
            typeof project.icon === "string" && project.icon.trim()
              ? project.icon.trim()
              : "📦"
        };
      });
    }

    async function loadDashboardProjects() {
      const response = await fetch("./projects.json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          "projects.json could not be loaded (" +
          response.status +
          ")."
        );
      }

      let data;

      try {
        data = await response.json();
      } catch (error) {
        throw new Error("projects.json contains invalid JSON.");
      }

      return normalizeDashboardProjects(data);
    }

    function getDashboardProjectUrl(project) {
      if (project.url) return project.url;

      const safeFolder = project.folder
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

      return new URL(
        "./" + safeFolder + "/",
        window.location.href
      ).href;
    }

    function normalizeProjectAccessRow(row) {
      return {
        projectId: String(row?.project_id || ""),
        accessMode:
          ["everyone", "admin", "groups"].includes(row?.access_mode)
            ? row.access_mode
            : "everyone",
        allowedGroupIds:
          Array.isArray(row?.allowed_group_ids)
            ? row.allowed_group_ids.map(String)
            : []
      };
    }

    function getProjectAccess(projectId) {
      return dashboardProjectAccess[projectId] || {
        projectId,
        accessMode: "everyone",
        allowedGroupIds: []
      };
    }

    async function loadDashboardProjectPermissions() {
      const nextAccess = {};

      try {
        const [
          accessResult,
          membershipResult
        ] = await Promise.all([
          supabaseClient
            .from("dashboard_project_access")
            .select("project_id,access_mode,allowed_group_ids"),

          supabaseClient
            .from("dashboard_group_members")
            .select("group_id,user_id")
        ]);

        if (accessResult.error) throw accessResult.error;
        if (membershipResult.error) throw membershipResult.error;

        (accessResult.data || []).forEach(row => {
          const normalized = normalizeProjectAccessRow(row);

          if (normalized.projectId) {
            nextAccess[normalized.projectId] = normalized;
          }
        });

        dashboardProjectAccess = nextAccess;

        currentDashboardGroupIds = new Set(
          (membershipResult.data || [])
            .map(row => String(row.group_id))
        );
      } catch (error) {
        console.warn("Project permission load:", error);
        dashboardProjectAccess = {};
        currentDashboardGroupIds = new Set();
      }

      return dashboardProjectAccess;
    }

    function canCurrentDashboardUserSeeProject(project) {
      const access = getProjectAccess(project.id);

      if (currentDashboardUserIsAdmin && adminViewEnabled) {
        return true;
      }

      if (access.accessMode === "everyone") return true;
      if (access.accessMode === "admin") return false;

      if (access.accessMode === "groups") {
        return access.allowedGroupIds.some(groupId =>
          currentDashboardGroupIds.has(String(groupId))
        );
      }

      return false;
    }

    function projectAccessLabel(project) {
      const access = getProjectAccess(project.id);

      if (access.accessMode === "everyone") return "Everyone";
      if (access.accessMode === "admin") return "Admins Only";

      const names = dashboardGroups
        .filter(group =>
          access.allowedGroupIds.includes(String(group.id))
        )
        .map(group => group.name);

      return names.length
        ? names.join(", ")
        : "Specific Groups";
    }

    function renderDashboardProjects(projects) {
      const grid = getById("projects-grid");

      if (!grid) return;

      grid.innerHTML = "";

      const visibleProjects =
        projects.filter(canCurrentDashboardUserSeeProject);

      if (!visibleProjects.length) {
        const empty = document.createElement("div");
        empty.className = "projects-empty";
        empty.textContent =
          "No projects are available for this account.";
        grid.appendChild(empty);
        return;
      }

      visibleProjects.forEach(project => {
        const tile = document.createElement("a");
        tile.className = "project-tile";
        tile.href = getDashboardProjectUrl(project);
        tile.setAttribute(
          "aria-label",
          "Open " + project.name
        );

        const icon = document.createElement("span");
        icon.className = "project-tile-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = project.icon;

        const title = document.createElement("h3");
        title.className = "project-tile-title";
        title.textContent = project.name;

        tile.append(icon, title);

        if (currentDashboardUserIsAdmin && adminViewEnabled) {
          const badge = document.createElement("span");
          badge.className = "project-access-badge";
          badge.textContent = projectAccessLabel(project);
          tile.appendChild(badge);
        }

        grid.appendChild(tile);
      });
    }

    function renderAdminSettingsVisibility() {
      const visible =
        currentDashboardUserIsAdmin &&
        adminViewEnabled;

      const tileSection =
        getById("admin-settings-section");

      const projectSection =
        getById("admin-projects-settings-section");

      if (tileSection) tileSection.hidden = !visible;
      if (projectSection) projectSection.hidden = !visible;
    }

    function getDashboardUserEmail(userId) {
      return (
        dashboardUsers.find(user =>
          String(user.user_id) === String(userId)
        )?.email ||
        "Dashboard account"
      );
    }

    async function loadAdminProjectData() {
      if (!currentDashboardUserIsAdmin) return;

      const groupsStatus =
        getById("admin-groups-status");

      const projectStatus =
        getById("admin-project-access-status");

      if (groupsStatus) {
        groupsStatus.textContent = "Loading groups…";
      }

      if (projectStatus) {
        projectStatus.textContent =
          "Loading project access…";
      }

      try {
        const [
          groupsResult,
          membersResult,
          usersResult,
          projects,
          accessResult
        ] = await Promise.all([
          supabaseClient
            .from("dashboard_groups")
            .select("id,name,created_at")
            .order("name"),

          supabaseClient
            .from("dashboard_group_members")
            .select("group_id,user_id"),

          supabaseClient.rpc(
            "admin_list_dashboard_users"
          ),

          loadDashboardProjects(),

          supabaseClient
            .from("dashboard_project_access")
            .select(
              "project_id,access_mode,allowed_group_ids"
            )
        ]);

        if (groupsResult.error) throw groupsResult.error;
        if (membersResult.error) throw membersResult.error;
        if (usersResult.error) throw usersResult.error;
        if (accessResult.error) throw accessResult.error;

        dashboardGroups = groupsResult.data || [];
        dashboardGroupMembers = membersResult.data || [];
        dashboardUsers = usersResult.data || [];
        dashboardProjectAccess = {};

        (accessResult.data || []).forEach(row => {
          const normalized =
            normalizeProjectAccessRow(row);

          if (normalized.projectId) {
            dashboardProjectAccess[
              normalized.projectId
            ] = normalized;
          }
        });

        renderAdminGroupSettings();
        renderAdminProjectAccessSettings(projects);
      } catch (error) {
        console.error(
          "Admin project settings load:",
          error
        );

        if (groupsStatus) {
          groupsStatus.textContent =
            error.message ||
            "Groups could not be loaded.";
        }

        if (projectStatus) {
          projectStatus.textContent =
            error.message ||
            "Project access could not be loaded.";
        }
      }
    }

    async function createDashboardGroup() {
      const input =
        getById("admin-new-group-name");

      const status =
        getById("admin-groups-status");

      const name =
        String(input?.value || "").trim();

      if (!name) {
        if (status) {
          status.textContent =
            "Enter a group name first.";
        }

        return;
      }

      try {
        const { error } =
          await supabaseClient
            .from("dashboard_groups")
            .insert({ name });

        if (error) throw error;

        input.value = "";
        await loadAdminProjectData();

        status.textContent = "Group created.";
      } catch (error) {
        status.textContent =
          error.message ||
          "The group could not be created.";
      }
    }

    async function addUserToDashboardGroup(
      groupId,
      userId
    ) {
      if (!userId) return;

      const status =
        getById("admin-groups-status");

      try {
        const { error } =
          await supabaseClient
            .from("dashboard_group_members")
            .upsert(
              {
                group_id: groupId,
                user_id: userId
              },
              {
                onConflict: "group_id,user_id"
              }
            );

        if (error) throw error;

        await loadAdminProjectData();

        status.textContent =
          "Group membership updated.";
      } catch (error) {
        status.textContent =
          error.message ||
          "The user could not be added to the group.";
      }
    }

    async function removeUserFromDashboardGroup(

        getById("admin-groups-status");

      try {
        const { error } =
          await supabaseClient
            .from("dashboard_group_members")
            .delete()

            .eq("user_id", userId);

        if (error) throw error;

        await loadAdminProjectData();

        status.textContent =
          "User removed from group.";
      } catch (error) {
        status.textContent =
          error.message ||
          "The user could not be removed from the group.";
      }
    }

    async function deleteDashboardGroup(
      groupId,
      groupName
    ) {
      if (
        !window.confirm(
          "Delete the group ‘" +
          groupName +
          "’?"
        )
      ) {
        return;
      }

      const status =
        getById("admin-groups-status");

      try {
        const { error } =
          await supabaseClient
            .from("dashboard_groups")
            .delete()
            .eq("id", groupId);

        if (error) throw error;

        await loadAdminProjectData();

        status.textContent = "Group deleted.";
      } catch (error) {
        status.textContent =
          error.message ||
          "The group could not be deleted.";
      }
    }

    function renderAdminGroupSettings() {
      const list =
        getById("admin-group-list");

      const status =
        getById("admin-groups-status");

      if (!list || !status) return;

      list.innerHTML = "";

      if (!dashboardGroups.length) {
        const empty =
          document.createElement("div");

        empty.className =
          "admin-group-card";

        empty.textContent =
          "No groups yet. Create one above.";

        list.appendChild(empty);

        status.textContent =
          "Groups control project visibility for sets of Dashboard accounts.";

        return;
      }

      dashboardGroups.forEach(group => {
        const card =
          document.createElement("div");

        card.className =
          "admin-group-card";

        const top =
          document.createElement("div");

        top.className =
          "admin-project-access-topline";

        const details =
          document.createElement("div");

        const name =
          document.createElement("span");

        name.className =
          "admin-group-name";

        name.textContent = group.name;

        const members =
          dashboardGroupMembers.filter(member =>
            String(member.group_id) ===
            String(group.id)
          );

        const note =
          document.createElement("span");

        note.className =
          "admin-group-note";

        note.textContent =
          members.length +
          (members.length === 1
            ? " member"
            : " members");

        details.append(name, note);

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
          "admin-group-action danger";

        deleteButton.textContent =
          "Delete Group";

        deleteButton.addEventListener(
          "click",
          () => deleteDashboardGroup(
            group.id,
            group.name
          )
        );

        top.append(details, deleteButton);
        card.appendChild(top);

        const memberArea =
          document.createElement("div");

        memberArea.className =
          "admin-group-members";

        members.forEach(member => {
          const chip =
            document.createElement("span");

          chip.className =
            "admin-group-member-chip";

          chip.append(
            document.createTextNode(
              getDashboardUserEmail(
                member.user_id
              )
            )
          );

          const remove =
            document.createElement("button");

          remove.type = "button";
          remove.textContent = "×";

          remove.addEventListener(
            "click",
            () => removeUserFromDashboardGroup(
              group.id,
              member.user_id
            )
          );

          chip.appendChild(remove);
          memberArea.appendChild(chip);
        });

        const select =
          document.createElement("select");

        select.className =
          "admin-group-member-select";

        const placeholder =
          document.createElement("option");

        placeholder.value = "";
        placeholder.textContent =
          "Add account…";

        select.appendChild(placeholder);

        const memberIds = new Set(
          members.map(member =>
            String(member.user_id)
          )
        );

        dashboardUsers
          .filter(user =>
            !memberIds.has(
              String(user.user_id)
            )
          )
          .forEach(user => {
            const option =
              document.createElement("option");

            option.value = user.user_id;

            option.textContent =
              user.email +
              (
                user.role === "admin"
                  ? " · Admin"
                  : ""
              );

            select.appendChild(option);
          });

        select.addEventListener(
          "change",
          () => {
            const userId = select.value;
            select.value = "";

        memberArea.appendChild(select);
        card.appendChild(memberArea);
        list.appendChild(card);

      status.textContent =
        "Create groups and assign Dashboard accounts. A user can belong to multiple groups.";

    async function saveProjectAccess(
      projectId,
      accessMode,
      allowedGroupIds
    ) {
      const status =
        getById("admin-project-access-status");

      try {
        const row = {
          project_id: projectId,
          access_mode: accessMode,
          allowed_group_ids:
            accessMode === "groups"
              ? allowedGroupIds
              : [],
          updated_at:
            new Date().toISOString()
        };

        const { error } =
          await supabaseClient
            .from("dashboard_project_access")
            .upsert(
              row,
              { onConflict: "project_id" }
            );

        if (error) throw error;

        dashboardProjectAccess[projectId] =
          normalizeProjectAccessRow(row);

        status.textContent =
          "Project visibility saved.";
      } catch (error) {
        status.textContent =
          error.message ||
          "Project visibility could not be saved.";

        throw error;
      }
    }

    function renderAdminProjectAccessSettings(
      projects
    ) {
      const list =
        getById("admin-project-access-list");

      const status =
        getById("admin-project-access-status");

      if (!list || !status) return;

      list.innerHTML = "";

      projects.forEach(project => {
        const access =
          getProjectAccess(project.id);

        const row =
          document.createElement("div");

        row.className =
          "admin-project-access-row";

        const topline =
          document.createElement("div");

        topline.className =
          "admin-project-access-topline";

        const details =
          document.createElement("div");

        const title =
          document.createElement("span");

        title.className =
          "admin-project-access-title";

        title.textContent =
          project.name;

        const note =
          document.createElement("span");

        note.className =
          "admin-project-access-note";

        note.textContent =
          access.accessMode === "groups"
            ? "Visible to selected groups"
            : (
              access.accessMode === "admin"
                ? "Visible only to administrators"
                : "Visible to all signed-in accounts"
            );

        details.append(title, note);

        const select =
          document.createElement("select");

        select.className =
          "admin-project-access-select";

        [
          ["everyone", "Everyone"],
          ["admin", "Admins Only"],
          ["groups", "Specific Groups"]
        ].forEach(([value, label]) => {
          const option =
            document.createElement("option");

          option.value = value;
          option.textContent = label;
          select.appendChild(option);
        });

        select.value =
          access.accessMode;

        topline.append(details, select);
        row.appendChild(topline);

        const groupPicker =
          document.createElement("div");

        groupPicker.className =
          "admin-project-group-picker";

        groupPicker.hidden =
          access.accessMode !== "groups";

        if (!dashboardGroups.length) {
          const message =
            document.createElement("span");

          message.className =
            "admin-project-access-note";

          message.textContent =
            "Create a group above before using Specific Groups.";

          groupPicker.appendChild(message);
        } else {
          dashboardGroups.forEach(group => {
            const label =
              document.createElement("label");

            label.className =
              "admin-project-group-option";

            const checkbox =
              document.createElement("input");

            checkbox.type = "checkbox";
            checkbox.value = group.id;

            checkbox.checked =
              access.allowedGroupIds.includes(
                String(group.id)
              );

            checkbox.addEventListener(
              "change",
              async () => {
                const selected =
                  Array
                    .from(
                      groupPicker.querySelectorAll(
                        'input[type="checkbox"]:checked'
                      )
                    )
                    .map(input => input.value);

                await saveProjectAccess(
                  project.id,
                  "groups",
                  selected
                );

                await loadAdminProjectData();
              }
            );

            label.append(
              checkbox,
              document.createTextNode(
                group.name
              )
            );

            groupPicker.appendChild(label);
          });
        }

        row.appendChild(groupPicker);

        select.addEventListener(
          "change",
          async () => {
            const mode = select.value;

            const existing =
              getProjectAccess(
                project.id
              ).allowedGroupIds;

            groupPicker.hidden =
              mode !== "groups";

            await saveProjectAccess(
              project.id,
              mode,
              existing
            );

            await loadAdminProjectData();
          }
        );

        list.appendChild(row);
      });

      status.textContent =
        "Project rules are shared across My Dashboard accounts and saved in Supabase.";
    }

            await supabaseClient
              .from("dashboard_groups")
              .select("id,name")
              .order("name");

          if (!groupsResult.error) {
            dashboardGroups =
              groupsResult.data || [];
          }

          '<div class="projects-empty">' +
          '<strong>Projects could not be loaded.</strong><br>' +

          '</div>';

        () => closeButton.focus(),
        0
      );
    }

      getById("projects-view").hidden = true;
      document.body.style.overflow = "";
    }

ed project permissions to the Projects Hub. Admin Settings includes group creation, account membership management, and per-project visibility controls for Everyone, Admins Only, or selected groups. Project visibility is stored in Supabase and the Projects launcher filters its tiles for the signed-in account while Admin View continues to show all projects for management and testing."},\n      {version:"0.5.1",title:"Dashboard Folder Migration Fix",description:"Bug Fixes: Updates My Dashboard for the live folder rename from Projects/Custom-UI to Projects/Dashboard while preserving the immutable 0.4.2 historical source path required by the Projects Hub loader. Live OAuth redirects derive from the current Dashboard URL and project loading resolves from Dashboard/projects.json."},\n      {version:"0.5.0",title:"Projects Hub & Project Launcher",description:"Introduces the Projects feature cycle with a new Projects dashboard tile and an in-dashboard project launcher while preserving the 0.4.2 Automatic Admin View behavior."},\n      {version:"0.4.2"',

    async function loadDashboard() {
      const loader =
        document.getElementById("loader");

      try {
        const response =
          await fetch(
            DASHBOARD_042_SOURCE,
            { cache: "no-store" }
          );

        if (!response.ok) {
          throw new Error(
            "Could not load the Version 0.4.2 base (" +
            response.status +
            ")."
          );
        }

        const source =
          apply054Patch(
            await response.text()
          );

        document.open();
        document.write(source);
        document.close();
      } catch (error) {
        console.error(error);

        loader.classList.add("error");

        loader.innerHTML =
          "<h1>Dashboard could not load</h1>" +
          "<p>" +
          String(
            error && error.message
              ? error.message
              : error
          ) +
          "<br><br>" +
          "Version 0.5.5 preserves the immutable 0.4.2 Dashboard base and layers the Projects, access-control, and centralized-login updates over it." +
          "</p>";
      }
    }

    loadDashboard();
