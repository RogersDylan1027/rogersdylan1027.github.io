<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Jobs · My Dashboard · v0.6.0</title>
  <link rel="icon" href="../logo-app.png" type="image/png">
  <script src="../dashboard-config.js?v=0.11.4" defer></script>
  <script src="./supabase-workspace.js?v=0.6.0" defer></script>
  <script src="./recommendations.js?v=0.6.0" defer></script>
  <script src="./jobs-page.js?v=0.6.0" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#263345;font:16px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:32px auto;padding:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0 auto 0 0}a{color:#28487e}button{font:inherit;background:white;color:#28487e;border:1px solid #b9c9d9;border-radius:9px;padding:10px 16px;cursor:pointer}.panel{background:white;border:1px solid #d5deea;border-radius:16px;padding:24px;margin-top:24px}.muted{color:#57667b}button:disabled{opacity:.5}[hidden]{display:none!important}

    .jobs-connected{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;margin-top:18px}.jobs-connected h2,.jobs-connected #jobs-sign-in{display:none}.jobs-connected p{margin:0;color:#53657b;font-size:14px}.jobs-connected button{font-size:14px;padding:8px 12px;min-height:44px;flex-shrink:0}button,a,input,select,textarea{touch-action:manipulation}@media(max-width:600px){main{margin:12px auto;padding:16px}header h1{font-size:30px}header a{font-size:14px}.panel{padding:18px}.jobs-connected{padding:10px;align-items:flex-start}.jobs-connected p{font-size:13px}.jobs-connected button{font-size:13px;padding:8px}}
  </style>
</head>
<body>
  <main>
    <header><h1>Jobs</h1><a href="../">Back to Dashboard</a></header>
    <p class="muted">My Dashboard v0.11.4 · Jobs v0.6.0</p>
    <section class="panel" aria-labelledby="jobs-heading">
      <h2 id="jobs-heading">Sign in to your Jobs workspace</h2>
      <p id="jobs-status" role="status" aria-live="polite">Checking your Dashboard access…</p>
      <button id="jobs-open" type="button" disabled>Open Jobs</button>
      <a id="jobs-sign-in" href="../login.html" hidden>Sign in to Dashboard</a>
    </section>
    <noscript><p>Enable JavaScript to sign in and load private Jobs data.</p></noscript>
  </main>
</body>
</html>
