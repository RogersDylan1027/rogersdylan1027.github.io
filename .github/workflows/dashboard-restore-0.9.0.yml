name: Restore Dashboard 0.9.0 Account Recovery

on:
  push:
    paths:
      - .github/workflows/dashboard-restore-0.9.0.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-mistake Dashboard shell
        shell: bash
        run: |
          git checkout 1ed2e899f9f1f6d9220df88a8214df0ee74c2940 -- \
            Projects/Dashboard/index.html \
            Projects/Dashboard/login.html \
            Projects/Dashboard/dashboard-entry.js

      - name: Reapply only account-selection and recovery changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          login = Path('Projects/Dashboard/login.html')
          text = login.read_text(encoding='utf-8')
          old = '''          options: {
            redirectTo: redirectUrl.href
          }'''
          new = '''          options: {
            redirectTo: redirectUrl.href,
            queryParams: {
              prompt: "select_account"
            }
          }'''
          if old not in text:
              raise SystemExit('Google login OAuth block not found')
          text = text.replace(old, new, 1)
          login.write_text(text, encoding='utf-8')

          entry = Path('Projects/Dashboard/dashboard-entry.js')
          text = entry.read_text(encoding='utf-8')

          anchor = '''  async function startStreamingRuntime() {'''
          helpers = r'''  function addAccountChooserPrompt(options = {}) {
    const queryParams = { ...(options.queryParams || {}) };
    const promptParts = String(queryParams.prompt || "")
      .split(/\s+/)
      .filter(Boolean);

    if (!promptParts.includes("select_account")) {
      promptParts.push("select_account");
    }

    queryParams.prompt = promptParts.join(" ");
    return { ...options, queryParams };
  }

  function enforceAccountChooserForOAuth(client) {
    const auth = client?.auth;
    if (!auth || auth.__dashboardAccountChooserPolicy) return client;

    const originalSignInWithOAuth = auth.signInWithOAuth?.bind(auth);
    const originalLinkIdentity = auth.linkIdentity?.bind(auth);

    if (originalSignInWithOAuth) {
      auth.signInWithOAuth = (credentials = {}) =>
        originalSignInWithOAuth({
          ...credentials,
          options: addAccountChooserPrompt(credentials.options)
        });
    }

    if (originalLinkIdentity) {
      auth.linkIdentity = (credentials = {}) =>
        originalLinkIdentity({
          ...credentials,
          options: addAccountChooserPrompt(credentials.options)
        });
    }

    Object.defineProperty(auth, "__dashboardAccountChooserPolicy", {
      value: true,
      configurable: false,
      enumerable: false,
      writable: false
    });

    return client;
  }

  function installConnectedAccountRefresh(client) {
    if (document.getElementById("connected-accounts-refresh-button")) return;

    const googleConnectButton = document.getElementById("calendar-connect-button");
    const section = googleConnectButton?.closest(".settings-section");
    const description = section?.querySelector(".settings-section-description");
    if (!section || !description) return;

    const controls = document.createElement("div");
    controls.className = "settings-account-buttons";
    controls.style.margin = "12px 0 6px";

    const button = document.createElement("button");
    button.id = "connected-accounts-refresh-button";
    button.className = "calendar-action-button secondary";
    button.type = "button";
    button.textContent = "Refresh Connected Accounts";

    const status = document.createElement("p");
    status.id = "connected-accounts-refresh-status";
    status.className = "calendar-connection-status";
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");
    status.textContent = "Reload saved account connections and their available data.";

    controls.appendChild(button);
    description.insertAdjacentElement("afterend", controls);
    controls.insertAdjacentElement("afterend", status);

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Refreshing connected accounts…";

      try {
        const { error: refreshError } = await client.auth.refreshSession();
        if (refreshError) throw refreshError;

        const { data: userData, error: userError } = await client.auth.getUser();
        if (userError) throw userError;
        if (!userData?.user) throw new Error("Your Dashboard session is no longer signed in.");

        window.updateMicrosoftConnectionView?.(userData.user);
        await window.refreshDashboardServicePreferencesFromUser?.();

        let googleAccounts = null;
        if (typeof window.listGoogleAccounts === "function") {
          googleAccounts = await window.listGoogleAccounts();
        }

        if (Array.isArray(googleAccounts) && googleAccounts.length &&
            typeof window.loadGoogleCalendarEvents === "function") {
          await window.loadGoogleCalendarEvents();
        }

        window.renderCalendarAccountPreferences?.();
        window.renderFilesAccountSidebar?.();
        window.updateFilesGoogleAccountSelector?.();

        const count = Array.isArray(googleAccounts) ? googleAccounts.length : null;
        status.textContent = count === null
          ? "Connected accounts refreshed."
          : `Refresh complete · ${count} Google account${count === 1 ? "" : "s"} reloaded.`;
      } catch (error) {
        console.error("Connected account refresh:", error);
        status.textContent = error?.message ||
          "Connected accounts could not be refreshed. Reconnect any account that asks you to sign in again.";
      } finally {
        button.disabled = false;
      }
    });
  }

'''
          if anchor not in text:
              raise SystemExit('dashboard-entry helper insertion point not found')
          text = text.replace(anchor, helpers + anchor, 1)

          old_client = '''      const client = window.supabase.createClient(
        config.supabaseUrl,
        config.supabasePublishableKey,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );'''
          new_client = '''      const client = enforceAccountChooserForOAuth(
        window.supabase.createClient(
          config.supabaseUrl,
          config.supabasePublishableKey,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        )
      );'''
          if old_client not in text:
              raise SystemExit('Dashboard Supabase client block not found')
          text = text.replace(old_client, new_client, 1)

          old_runtime = '''      // The Dashboard shell is now static, so attach the Streaming runtime
      // as soon as the parsed Settings/Changelog shell is available.
      setTimeout(startStreamingRuntime, 0);'''
          new_runtime = '''      // Attach account recovery controls and Streaming after the static shell is parsed.
      setTimeout(async () => {
        try {
          await waitForDashboardShell();
          installConnectedAccountRefresh(client);
        } catch (error) {
          console.warn("Connected account recovery controls:", error);
        }
      }, 0);
      setTimeout(startStreamingRuntime, 0);'''
          if old_runtime not in text:
              raise SystemExit('Dashboard runtime startup block not found')
          text = text.replace(old_runtime, new_runtime, 1)
          entry.write_text(text, encoding='utf-8')
          PY

      - name: Verify true 0.9.0 baseline and account patch
        shell: bash
        run: |
          grep -q 'version: "0.9.0"' Projects/Dashboard/dashboard-config.js
          grep -q 'my-dashboard-v0.9.0' Projects/Dashboard/service-worker.js
          grep -q 'reviewsUrl: BASE_PATH + "Reviews/"' Projects/Dashboard/dashboard-config.js
          grep -q 'prompt: "select_account"' Projects/Dashboard/login.html
          grep -q 'connected-accounts-refresh-button' Projects/Dashboard/dashboard-entry.js
          ! grep -q 'Version 0.7.3' Projects/Dashboard/index.html
          ! grep -q 'version:"0.7.3"' Projects/Dashboard/index.html
          ! grep -q 'Version 0.7.3' Projects/Dashboard/login.html
          ! grep -q 'Version 0.7.3' Projects/Dashboard/dashboard-entry.js

      - name: Build corrected replacement package
        shell: bash
        run: |
          mkdir -p release/Dashboard
          cp Projects/Dashboard/index.html release/Dashboard/index.html
          cp Projects/Dashboard/login.html release/Dashboard/login.html
          cp Projects/Dashboard/dashboard-entry.js release/Dashboard/dashboard-entry.js
          cp Projects/Dashboard/dashboard-config.js release/Dashboard/dashboard-config.js
          cp Projects/Dashboard/service-worker.js release/Dashboard/service-worker.js

      - name: Upload corrected Dashboard 0.9.0 package
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-0.9.0-account-recovery
          path: release/Dashboard
          if-no-files-found: error
          retention-days: 30

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/Dashboard/index.html Projects/Dashboard/login.html Projects/Dashboard/dashboard-entry.js
          git rm .github/workflows/dashboard-restore-0.9.0.yml
          git commit -m "Restore Dashboard 0.9.0 with account recovery"
          git push
