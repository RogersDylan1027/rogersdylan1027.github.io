name: Budget 0.6.0 Car Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Budget 0.6.0
        shell: bash
        run: |
          python3 <<'PY2'
          from pathlib import Path
          import base64,gzip,subprocess
          p=Path('Projects/Dashboard/Budget/index.html')
          s=p.read_text(encoding='utf-8')
          if '<title>Budget · 0.6.0</title>' not in s:
              if '<title>Budget · 0.5.0</title>' not in s:
                  raise SystemExit('Expected Budget 0.5.0 as upgrade base.')
              patch=gzip.decompress(base64.b64decode(''))
              Path('/tmp/budget.patch').write_bytes(patch)
              subprocess.run(['git','apply','--whitespace=nowarn','/tmp/budget.patch'],check=True)
          js=Path('Projects/Dashboard/Budget/budget-supabase.js')
          t=js.read_text(encoding='utf-8').replace('Budget 0.5.0 · Supabase cross-device sync','Budget 0.6.0 · Supabase cross-device sync')
          js.write_text(t,encoding='utf-8')
          Path('Projects/Dashboard/Budget/CHANGELOG.txt').write_text('Version 0.6.0: Car Fuel History & Averages\n\nDescription:\nAdds a Car-focused fuel history system to Budget. Users can save dated fill-ups\nby entering any two of total cost, gallons, or price per gallon; Budget\ncalculates the third value. Fuel history syncs with the rest of Budget through\nthe existing Supabase snapshot.\n\nChanges:\n- Renames the Gas tab to Car while preserving the existing Gas Calculator.\n- Adds Gas Fill-Up History under the Car tab.\n- Each fill-up accepts a date plus any 2 of: total cost, gallons, price/gallon.\n- Calculates the missing third value automatically.\n- Validates all three values when the user enters all three.\n- Shows weighted average price per gallon and average fill-up cost.\n- Adds an independent average-spending duration: Weekly, Every 2 Weeks,\n  Monthly, Yearly, or Every 2 Years.\n- Requires enough dated history for the selected native duration before\n  calculating or converting the average.\n- Converts a valid native Car average to the Budget\'s current display period.\n- Adds "Use Average Gas Cost in Current Budget" using the Car duration as the\n  saved expense frequency.\n- Fill-up history is included automatically in Budget\'s existing Supabase\n  cross-device state sync.\n- Preserves Budget 0.5.0 features and data migration.\n\nVersion 0.5.0: Supabase Cross-Device Budget Sync\n\nDescription:\nConnects Budget to the existing My Dashboard Supabase account so the same\nBudget data can be used across devices. Existing local data from the first\ndevice is uploaded when no cloud Budget exists, and later devices load that\nshared copy. Also adds selectable spending periods to Monthly Expenses.\n\nChanges:\n- Adds Supabase synchronization using the existing Dashboard login.\n- localStorage remains the immediate local cache.\n- First device uploads its existing local Budget when Supabase is empty.\n- Other devices load the same Supabase Budget for that account.\n- Adds Weekly, Every 2 Weeks, Monthly, Yearly, and Every 2 Years spending\n  periods to Monthly Expenses.\n- Monthly Expenses remains permanently included in Main Budget.\n- Purchases continue to reset when the credit-card statement closes.\n- Preserves all existing 0.4.2 Budget functionality.\n',encoding='utf-8')
          PY2

      - name: Validate and commit
        shell: bash
        run: |
          node --check Projects/Dashboard/Budget/budget-supabase.js
          python3 - <<'PY2'
          from pathlib import Path
          s=Path('Projects/Dashboard/Budget/index.html').read_text(encoding='utf-8')
          required=['<title>Budget · 0.6.0</title>','Gas Fill-Up History','id="carAveragePeriod"','id="fillupDialog"','budget-local-0.5.0','budget-supabase.js?v=0.6.0']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          if any(x in s for x in ['<<<<<<<','=======','>>>>>>>']): raise SystemExit('Merge markers found')
          PY2
          if git diff --quiet -- Projects/Dashboard/Budget; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/Dashboard/Budget
          git commit -m "Budget 0.6.0: Car fuel history and averages [skip budget-car-upgrade]"
          git push
