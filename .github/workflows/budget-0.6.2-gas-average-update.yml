name: Budget 0.6.2 Gas Average Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Budget 0.6.2
        shell: bash
        run: |
          echo '  ' | base64 -d > /tmp/budget062.py
          python3 /tmp/budget062.py
      - name: Commit Budget update
        shell: bash
        run: |
          if git diff --quiet -- Projects/Dashboard/Budget; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/Dashboard/Budget
          git commit -m "Budget 0.6.2: Automatic gas average updates [skip budget-gas-average]"
          git push
