name: Budget 0.6.2 Gas Average Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Budget 0.6.2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('Projects/Dashboard/Budget/index.html')
          s=p.read_text(encoding='utf-8')
          if '<title>Budget · 0.6.2</title>' not in s:
              if '<title>Budget · 0.6.1</title>' not in s:
                  raise SystemExit('Expected Budget 0.6.1 as upgrade base.')
              s=s.replace('<title>Budget · 0.6.1</title>','<title>Budget · 0.6.2</title>')
              s=s.replace('<!-- Budget 0.6.1: Receipt-date fuel tracking and automatic fill-up duration. -->','<!-- Budget 0.6.2: Automatic gas average updates without duplicate budget items. -->')
              s=s.replace('const KEY="budget-local-0.6.1", USER="local-user";','const KEY="budget-local-0.6.2", USER="local-user";')
              s=s.replace('      JSON.parse(localStorage.getItem("budget-local-0.6.0")) ||','      JSON.parse(localStorage.getItem("budget-local-0.6.1")) ||\n      JSON.parse(localStorage.getItem("budget-local-0.6.0")) ||')
              s=s.replace('budget-supabase.js?v=0.6.1','budget-supabase.js?v=0.6.2')
              old='''$("useAverageGas").onclick=()=>{const m=carMetrics(),b=cur();if(!m.valid)return;if(b.type==="monthly"){alert("Use Add Purchase for Monthly Expenses purchases.");return}b.items??=[];b.items.push({id:"gasavg-"+Date.now(),type:"expense",name:"Average Gas Cost",category:"Car",amount:+m.budgetSpend.toFixed(2),period:state.view.period,enabled:true});save();renderAll()};'''
              new='''$("useAverageGas").onclick=()=>{
  const m=carMetrics(),b=cur();
  if(!m.valid)return;
  if(b.type==="monthly"){alert("Use Add Purchase for Monthly Expenses purchases.");return}
  b.items??=[];
  const values={type:"expense",name:"Average Gas Cost",category:"Car",amount:+m.budgetSpend.toFixed(2),period:state.view.period,managedType:"average-gas-cost"};
  let item=b.items.find(x=>x.managedType==="average-gas-cost");
  if(!item)item=b.items.find(x=>String(x.id||"").startsWith("gasavg-")&&x.type==="expense"&&x.name==="Average Gas Cost"&&x.category==="Car");
  if(item)Object.assign(item,values);
  else b.items.push({id:"gas-average-cost",enabled:true,...values});
  save();renderAll();
};'''
              if old not in s: raise SystemExit('Average gas handler not found')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          js=Path('Projects/Dashboard/Budget/budget-supabase.js')
          t=js.read_text(encoding='utf-8').replace('Budget 0.6.1 · Supabase cross-device sync','Budget 0.6.2 · Supabase cross-device sync')
          js.write_text(t,encoding='utf-8')

          ch=Path('Projects/Dashboard/Budget/CHANGELOG.txt')
          old_ch=ch.read_text(encoding='utf-8')
          if not old_ch.startswith('Version 0.6.2:'):
              prefix='''Version 0.6.2: Automatic Gas Average Updates

Description:
Updates the automatically managed Average Gas Cost budget item instead of creating a duplicate each time the Car average is applied.

Changes:
- Checks the current budget for an existing managed Average Gas Cost item.
- Overwrites its amount and period when it already exists.
- Creates the Average Gas Cost item only when none exists.
- Adopts Average Gas Cost entries created by Budget 0.6.1 so the first 0.6.2 update does not create a duplicate.
- Uses an internal managed marker so unrelated manually created gas expenses are not overwritten.
- Preserves the existing enabled/disabled state when updating an existing item.
- Keeps the existing Supabase sync schema unchanged.

'''
              ch.write_text(prefix+old_ch,encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check Projects/Dashboard/Budget/budget-supabase.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('Projects/Dashboard/Budget/index.html').read_text(encoding='utf-8')
          required=['<title>Budget · 0.6.2</title>','budget-local-0.6.1','managedType:"average-gas-cost"','id:"gas-average-cost"','budget-supabase.js?v=0.6.2']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          if any(x in s for x in ['<<<<<<<','=======','>>>>>>>']): raise SystemExit('Merge markers found')
          for i,js in enumerate(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S)):
              if not js.strip(): continue
              f=Path(f'/tmp/budget062-{i}.js');f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          PY
          if git diff --quiet -- Projects/Dashboard/Budget; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/Dashboard/Budget
          git commit -m "Budget 0.6.2: Automatic gas average updates [skip budget-gas-average]"
          git push
