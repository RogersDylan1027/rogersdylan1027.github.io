name: Budget 0.6.1 Receipt Date

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Budget 0.6.1
        run: echo '' | base64 -d | python3
      - name: Validate and commit
        run: |
          node --check Projects/Dashboard/Budget/budget-supabase.js
          grep -q '<title>Budget · 0.6.1</title>' Projects/Dashboard/Budget/index.html
          grep -q 'averageDays=totalGap/gaps' Projects/Dashboard/Budget/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/Dashboard/Budget
          git commit -m "Budget 0.6.1: Receipt-date fuel tracking [skip budget-receipt-date]" || exit 0
          git push
