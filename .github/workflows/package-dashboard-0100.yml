name: Package Dashboard 0.10.0

on:
  push:
    paths:
      - '.github/workflows/package-dashboard-0100.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DASHBOARD_VERSION: '0.10.0'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create Dashboard ZIP
        run: |
          cd Projects
          zip -r "Dashboard-${DASHBOARD_VERSION}.zip" Dashboard
      - name: Upload Dashboard ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-${{ env.DASHBOARD_VERSION }}
          path: Projects/Dashboard-${{ env.DASHBOARD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
